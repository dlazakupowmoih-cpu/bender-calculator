<div class="card">
    <div class="section-title">Параметры трубы и геометрии</div>
    <div class="form-row">
        <div class="form-group">
            <label>Тип трубы</label>
            <select id="s-conduit-type" onchange="tab1.updateSizeOptions()">
                <option value="emt">EMT</option>
                <option value="imc">IMC</option>
                <option value="rigid">Rigid</option>
            </select>
        </div>
        <div class="form-group">
            <label>Размер трубы</label>
            <select id="s-conduit-size"></select>
        </div>
    </div>

    <div class="form-group">
        <label>Вид изгиба</label>
        <select id="s-bend-type" onchange="tab1.toggleSingleInputs()">
            <option value="stub">90° Stub-up (Прямой угол)</option>
            <option value="offset">Offset (Классический оффсет)</option>
            <option value="offset_box">Offset to Box (Заводка в коробку)</option>
            <option value="saddle3" selected>3-Point Saddle (Седло 3 точки)</option>
            <option value="saddle4">4-Point Saddle (Седло 4 точки / Обход балки)</option>
        </select>
    </div>

    <div class="form-group" id="s-angle-group-container">
        <label>Угол изгиба оффсета / седла</label>
        <select id="s-bend-angle" onchange="tab1.handleSingleAngleChange()">
            <option value="10">10° (плавный)</option>
            <option value="22.5">22.5° (стандарт)</option>
            <option value="30" selected>30° (ходовой)</option>
            <option value="45">45° (крутой)</option>
            <option value="custom">🛠 Свой угол...</option>
        </select>
        <div id="s-custom-slider-wrap" style="display:none; margin-top:8px;">
            <label>Кастомный угол: <span id="s-slider-val-lbl">30</span>°</label>
            <div class="slider-row" style="display:flex; gap:8px; align-items:center;">
                <input type="range" id="s-custom-slider" min="1" max="89" step="0.5" value="30" oninput="tab1.syncSingleSlider(this.value)" style="flex:3;">
                <input type="number" id="s-custom-num" min="1" max="89" step="0.5" value="30" oninput="tab1.syncSingleNum(this.value)" style="flex:1; text-align:center;">
            </div>
        </div>
    </div>

    <div class="form-group" id="s-val1-group">
        <label>Центр препятствия со стены</label>
        <div class="inch-split">
            <input type="number" id="s-v1-whole" value="36" min="0" />
            <select id="s-v1-frac" class="frac-select"></select>
        </div>
    </div>

    <div class="form-group" id="s-val2-group">
        <label>Высота препятствия (Depth со стены)</label>
        <div class="inch-split">
            <input type="number" id="s-v2-whole" value="4" min="0" />
            <select id="s-v2-frac" class="frac-select"></select>
        </div>
    </div>

    <div class="form-group" id="s-val3-group" style="display:none;">
        <label>Ширина препятствия (Flat Width)</label>
        <div class="inch-split">
            <input type="number" id="s-v3-whole" value="6" min="0" />
            <select id="s-v3-frac" class="frac-select"></select>
        </div>
    </div>

    <button class="btn" onclick="tab1.calculateSingleBend()">Рассчитать разметку</button>

    <div id="s-results" class="results" style="display:none;"></div>
    <div id="s-instructions" class="instructions" style="display:none;"></div>
</div>
