<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eto Bender Suka</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 16px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            color: #ffffff;
            margin-top: 0;
            margin-bottom: 4px;
        }
        .subtitle {
            text-align: center;
            color: #999;
            font-size: 14px;
            margin-bottom: 16px;
        }
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 16px;
        }
        .tab-btn {
            flex: 1;
            padding: 8px 2px;
            background: #2d2d2d;
            border: none;
            border-radius: 6px;
            color: #aaa;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            box-sizing: border-box;
        }
        .tab-btn.active {
            background: #2196f3;
            color: #fff;
            font-weight: bold;
        }
        .section-title {
            font-size: 14px;
            color: #888;
            margin-bottom: 10px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: #b0b0b0;
        }
        select, input {
            width: 100%;
            padding: 10px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }
        .calc-btn {
            width: 100%;
            padding: 12px;
            background: #2196f3;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .calc-btn:hover {
            background: #1976d2;
        }
        .result-card {
            margin-top: 20px;
            background: #252525;
            border-left: 4px solid #2196f3;
            padding: 15px;
            border-radius: 4px;
        }
        .mark-item {
            font-size: 16px;
            margin: 8px 0;
            color: #4caf50;
        }
        .steps-list {
            margin: 10px 0 0 0;
            padding-left: 20px;
            font-size: 14px;
            line-height: 1.5;
            color: #d0d0d0;
        }
        .steps-list li {
            margin-bottom: 6px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Eto Bender Suka</h2>
    <div class="subtitle">Профессиональный калькулятор трубогиба</div>
    
    <!-- 4 вкладки -->
    <div class="tabs">
        <button class="tab-btn active" id="tab1" onclick="switchTab(1)">1. Одиночный</button>
        <button class="tab-btn" id="tab2" onclick="switchTab(2)">2. Кик</button>
        <button class="tab-btn" id="tab3" onclick="switchTab(3)">3. Multi-Run</button>
        <button class="tab-btn" id="tab4" onclick="switchTab(4)">4. Параллельный</button>
    </div>

    <div class="section-title" id="sectionTitleHeader">Параметры трубы и геометрии</div>

    <div class="form-group">
        <label for="conduitType">Тип трубы</label>
        <select id="conduitType">
            <option value="emt">EMT</option>
            <option value="imc">IMC</option>
            <option value="rigid">Rigid</option>
        </select>
    </div>

    <div class="form-group">
        <label for="conduitSize">Размер трубы</label>
        <select id="conduitSize">
            <option value="1/2">1/2"</option>
            <option value="3/4" selected>3/4"</option>
            <option value="1">1"</option>
            <option value="1-1/4">1-1/4"</option>
            <option value="1-1/2">1-1/2"</option>
            <option value="2">2"</option>
        </select>
    </div>

    <div class="form-group" id="groupAngle">
        <label for="angle">Угол изгиба</label>
        <select id="angle">
            <option value="10">10°</option>
            <option value="15">15°</option>
            <option value="22.5">22.5°</option>
            <option value="30" selected>30° (ходовой)</option>
            <option value="45">45°</option>
            <option value="60">60°</option>
        </select>
    </div>

    <div class="form-group" id="groupV1">
        <label for="v1" id="labelV1">Базовая отметка / Центр</label>
        <input type="number" id="v1" step="0.125" value="36">
    </div>

    <div class="form-group" id="groupV2">
        <label for="v2" id="labelV2">Высота смещения (Depth)</label>
        <input type="number" id="v2" step="0.125" value="4">
    </div>

    <!-- Поля для Multi-Run -->
    <div class="form-group hidden" id="groupMultiRun">
        <label for="totalPipes">Количество труб в пакете</label>
        <input type="number" id="totalPipes" value="3" min="1" max="10" step="1">
        
        <label for="multiSpacing" style="margin-top: 8px;">Шаг между осями (Spacing)</label>
        <input type="number" id="multiSpacing" value="2" step="0.125">
    </div>

    <!-- Поля для Параллельного рана (отдельная труба) -->
    <div class="form-group hidden" id="groupParallel">
        <label for="pipeIndex">Номер трубы в ряду (0 — первая)</label>
        <input type="number" id="pipeIndex" value="1" min="0" step="1">
        
        <label for="pipeSpacing" style="margin-top: 8px;">Шаг между осями труб (Spacing)</label>
        <input type="number" id="pipeSpacing" value="2" step="0.125">
    </div>

    <button class="calc-btn" onclick="calculate()">Рассчитать разметку</button>

    <div id="resultContainer" class="result-card hidden">
        <h3 style="margin-top:0; color:#fff;">📍 Результат расчета:</h3>
        <div id="marksOutput"></div>
        <h3 style="margin-bottom:5px; color:#fff;">🛠 Порядок работы:</h3>
        <ol id="stepsOutput" class="steps-list"></ol>
    </div>
</div>

<script src="db.js"></script>
<script src="formulas.js"></script>

<script>
    let currentTab = 1;

    function switchTab(tabNum) {
        currentTab = tabNum;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab' + tabNum).classList.add('active');

        // Скрываем все специфичные блоки перед переключением
        document.getElementById('groupV2').classList.remove('hidden');
        document.getElementById('groupAngle').classList.remove('hidden');
        document.getElementById('groupMultiRun').classList.add('hidden');
        document.getElementById('groupParallel').classList.add('hidden');

        const labelV1 = document.getElementById('labelV1');
        const labelV2 = document.getElementById('labelV2');

        if (tabNum === 1) {
            // Одиночный (Offset)
            labelV1.innerText = "Базовая отметка / Центр препятствия";
            labelV2.innerText = "Высота смещения (Depth)";
        } else if (tabNum === 2) {
            // Кик (Kick)
            labelV1.innerText = "Расстояние до упора / База";
            labelV2.innerText = "Высота кика";
        } else if (tabNum === 3) {
            // Multi-Run
            labelV1.innerText = "Базовая отметка / Центр препятствия";
            labelV2.innerText = "Высота смещения (Depth)";
            document.getElementById('groupMultiRun').classList.remove('hidden');
        } else if (tabNum === 4) {
            // Параллельный ран
            labelV1.innerText = "Базовая отметка / Центр препятствия";
            labelV2.innerText = "Высота смещения (Depth)";
            document.getElementById('groupParallel').classList.remove('hidden');
        }
    }

    function calculate() {
        const type = document.getElementById('conduitType').value;
        const size = document.getElementById('conduitSize').value;
        const v1 = parseFloat(document.getElementById('v1').value) || 0;
        const v2 = parseFloat(document.getElementById('v2').value) || 0;
        const angle = parseFloat(document.getElementById('angle').value) || 30;

        const spec = conduitSpecs[type][size];
        let res;

        if (currentTab === 1) {
            res = ConduitMath.calcOffset(v1, v2, angle, spec.takeup, spec.clr);
        } else if (currentTab === 2) {
            res = ConduitMath.calcKick(v1, v2, angle, spec.takeup);
        } else if (currentTab === 3) {
            const totalPipes = parseInt(document.getElementById('totalPipes').value) || 3;
            const spacing = parseFloat(document.getElementById('multiSpacing').value) || 2;
            res = ConduitMath.calcMultiRun(v1, v2, angle, spec.takeup, spec.clr, totalPipes, spacing);
        } else if (currentTab === 4) {
            const pIndex = parseInt(document.getElementById('pipeIndex').value) || 0;
            const spacing = parseFloat(document.getElementById('pipeSpacing').value) || 2;
            res = ConduitMath.calcParallelOffset(v1, v2, angle, spec.takeup, spec.clr, pIndex, spacing);
        }

        if (!res) return;

        let marksHTML = '';
        res.marks.forEach(m => {
            marksHTML += `<div class="mark-item"><b>${m.label}:</b> ${m.formatted}</div>`;
        });
        document.getElementById('marksOutput').innerHTML = marksHTML;

        let stepsHTML = '';
        res.steps.forEach(s => {
            stepsHTML += `<li>${s}</li>`;
        });
        document.getElementById('stepsOutput').innerHTML = stepsHTML;

        document.getElementById('resultContainer').classList.remove('hidden');
    }
</script>

</body>
</html>
