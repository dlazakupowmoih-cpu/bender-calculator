                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>

    </header>

    <!-- Navigation Tabs -->
    <nav class="bg-slate-900/60 border-b border-slate-800 backdrop-blur-md sticky top-[61px] z-40 overflow-x-auto">

            <button onclick="switchTab('offset')" id="tab-btn-offset" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition-all whitespace-nowrap bg-slate-800 text-slate-400 hover:text-slate-200 hover:bg-slate-750">
                Оффсет & Кик (Offset / Kick)
            </button>
            <button onclick="switchTab('saddle3')" id="tab-btn-saddle3" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition-all whitespace-nowrap bg-slate-800 text-slate-400 hover:text-slate-200 hover:bg-slate-750">

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Controls / Inputs Column (Left 5 cols) -->

            <!-- Global Conduit Size Selector -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg">

                <div class="grid grid-cols-4 gap-2">
                    <button onclick="setConduitSize('1/2')" id="size-1/2" class="conduit-size-btn py-2.5 rounded-xl font-bold text-xs border border-slate-700 bg-amber-500 text-slate-950 transition-all">1/2" EMT</button>
                    <button onclick="setConduitSize('3/4')" id="size-3/4" class="conduit-size-btn py-2.5 rounded-xl font-bold text-xs border border-slate-700 bg-slate-800 text-slate-300 transition-all">3/4" EMT</button>
                    <button onclick="setConduitSize('1')" id="size-1" class="conduit-size-btn py-2.5 rounded-xl font-bold text-xs border border-slate-700 bg-slate-800 text-slate-300 transition-all">1" EMT</button>
                    <button onclick="setConduitSize('1-1/4')" id="size-1-1/4" class="conduit-size-btn py-2.5 rounded-xl font-bold text-xs border border-slate-700 bg-slate-800 text-slate-300 transition-all">1-1/4"</button>

        </section>

        <!-- Results & Visualizations Column (Right 7 cols) -->
        <section class="lg:col-span-7 space-y-6">
            
            <!-- Summary Results Card -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl relative overflow-hidden">
                <div class="absolute top-0 right-0 w-32 h-32 bg-amber-500/5 rounded-full blur-2xl pointer-events-none"></div>
                <h2 id="results-heading" class="text-xs font-bold text-amber-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    Результаты расчета и разметка
                </h2>
                
                <div id="results-grid" class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
                    <!-- Dynamic Result Cards -->
                </div>

                <!-- Detailed Step-by-Step Instructions -->
                <div class="bg-slate-950/70 border border-slate-800/80 rounded-xl p-4">

                        Пошаговые инструкции гибки
                    </h3>
                    <div id="step-by-step-instructions" class="space-y-3 text-xs text-slate-300">
                        <!-- Dynamic Instructions -->
                    </div>
                </div>
            </div>

            <!-- Visual SVG Diagram Card -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                <div class="flex items-center justify-between mb-4">
                    <h3 id="diagram-heading" class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2">
                        <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                        Визуальная схема гиба
                    </h3>
                    <span id="diagram-badge" class="text-[10px] bg-slate-800 text-amber-400 border border-amber-500/20 px-2 py-0.5 rounded-md font-mono">SVG Live Render</span>
                </div>
                <div id="svg-container" class="w-full bg-slate-950/80 rounded-xl border border-slate-800/80 flex items-center justify-center p-4 overflow-hidden min-h-[260px]">
                    <!-- Dynamic SVG Canvas -->
                </div>
            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        <p>Conduit Bending Calculator Pro • Designed for Professional Electricians & Apprentices</p>
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        // --- State Management ---
        let currentLang = 'ru';
        let currentTab = 'stub';
        let conduitSize = '1/2';

        // Gain/Take-up Constants for Bender Heads (Radius & Take-up in inches)
        const benderSpecs = {
            '1/2': { takeUp: 5, gain: 0.25, ctcDeduction: 2 },
            '3/4': { takeUp: 6, gain: 0.50, ctcDeduction: 3 },
            '1':   { takeUp: 8, gain: 0.75, ctcDeduction: 4 },
            '1-1/4': { takeUp: 11, gain: 1.25, ctcDeduction: 5 }
        };

        // Strict Tabular Shrink Constants per 1 inch of Rise
        // Offset / Kick Shrink Constants
        const offsetShrinkTable = {
            10: 0.0625,  // 1/16"
            15: 0.125,   // 1/8"
            22.5: 0.1875,// 3/16"
            30: 0.25,    // 1/4"
            45: 0.375,   // 3/8"
            60: 0.50     // 1/2"
        };

        // Multipliers for Cosecant / Csc
        const cscTable = {
            10: 5.7588,
            15: 3.8637,
            22.5: 2.6131,
            30: 2.0000,
            45: 1.4142,
            60: 1.1547
        };

        // Tangent multipliers for offset advance distance (Distance between bends = Rise * Tan(angle/2) or similar geometry, standard multiplier Rise * multiplier)
        const offsetMultiplierTable = {
            10: 5.6713,
            15: 3.7321,
            22.5: 2.4142,
            30: 1.7320,
            45: 1.0000,
            60: 0.5774
        };

        // Translations Dictionary
        const i18n = {
            ru: {
                title: "Калькулятор Гибки Труб Pro",
                subtitle: "Точный расчет шринков, оффсетов, седел и 3D пространственных трасс",
                copyPlan: "Копировать план",
                conduitSize: "Размер трубы (Conduit Size)",
                resultsHeading: "Результаты расчета и разметка",
                instructionsTitle: "Пошаговые инструкции гибки",
                diagramHeading: "Визуальная схема гиба",
                tabs: {
                    stub: "90° Стуб (Stub)",
                    offset: "Оффсет & Кик (Offset / Kick)",
                    saddle3: "3-Точечное Седло (3-Point)",
                    saddle4: "4-Точечное Седло (4-Point)",
                    spatial3d: "X-Y-Z 3D Трасса"
                },
                labels: {
                    stubHeight: "Высота стуба (Stub Height)",
                    offsetRise: "Высота подъема (Rise)",
                    angle: "Угол гиба (Angle)",
                    mode: "Режим отсчета (Reference Mode)",
                    modeA: "A: От конца трубы (From End)",
                    modeB: "B: От центра препятствия (From Obstacle Center)",
                    obstacleDist: "Расстояние до центра препятствия",
                    saddleDepth: "Глубина препятствия (Depth / Rise)",
                    obstWidth: "Ширина препятствия (Obstacle Width)",
                    axisX: "Ось X (Пробег / Run)",
                    axisY: "Ось Y (Подъем / Rise)",
                    axisZ: "Ось Z (Смещение / Depth)",
                    wholeInches: "Целые дюймы",
                    fraction: "Дробь (1/16)"
                }
            },
            en: {
                title: "Conduit Bending Calculator Pro",
                subtitle: "Precise calculation for shrink, offsets, saddles & 3D spatial runs",
                copyPlan: "Copy Plan",
                conduitSize: "Conduit Size",
                resultsHeading: "Calculation Results & Marks",
                instructionsTitle: "Step-by-Step Bending Instructions",
                diagramHeading: "Visual Bend Diagram",
                tabs: {
                    stub: "90° Stub Bend",
                    offset: "Offset & Kick",
                    saddle3: "3-Point Saddle",
                    saddle4: "4-Point Saddle",
                    spatial3d: "X-Y-Z 3D Spatial"
                },
                labels: {
                    stubHeight: "Stub Height",
                    offsetRise: "Offset Rise",
                    angle: "Bend Angle",
                    mode: "Reference Mode",
                    modeA: "A: From Conduit End",
                    modeB: "From Obstacle Center",
                    obstacleDist: "Distance to Obstacle Center",
                    saddleDepth: "Obstacle Depth / Rise",
                    obstWidth: "Obstacle Width",
                    axisX: "X Axis (Run)",
                    axisY: "Y Axis (Rise)",
                    axisZ: "Z Axis (Depth)",
                    wholeInches: "Whole Inches",
                    fraction: "Fraction (1/16)"
                }
            }
        };

        // --- Helper: Convert decimal inches to clean Imperial string (e.g. 14 3/8") ---
        function formatInches(decimalInches) {
            if (isNaN(decimalInches) || decimalInches < 0) return '0"';
            let whole = Math.floor(decimalInches);
            let remainder = decimalInches - whole;
            let sixteenths = Math.round(remainder * 16);
            if (sixteenths === 16) {
                whole += 1;
                sixteenths = 0;
            }
            if (sixteenths === 0) return `${whole}"`;
            
            // Reduce fraction
            let num = sixteenths;
            let den = 16;
            while (num % 2 === 0 && den % 2 === 0) {
                num /= 2;
                den /= 2;
            }
            return whole === 0 ? `${num}/${den}"` : `${whole} ${num}/${den}"`;
        }

        // --- Helper: Render Imperial Split Input (Whole + 1/16 dropdown) ---
        function renderImperialInput(idPrefix, labelText, defaultWhole = 12, defaultFrac = 0) {
            let optionsHTML = '';
            const fracTexts = ['0', '1/16', '1/8 (2/16)', '3/16', '1/4 (4/16)', '5/16', '3/8 (6/16)', '7/16', '1/2 (8/16)', '9/16', '5/8 (10/16)', '11/16', '3/4 (12/16)', '13/16', '7/8 (14/16)', '15/16'];
            for (let i = 0; i < 16; i++) {
                let val = i / 16;
                let text = fracTexts[i].split(' ')[0];
                optionsHTML += `<option value="${val}" ${i === defaultFrac ? 'selected' : ''}>${text}</option>`;
            }

            return `
                <div class="space-y-1.5">
                    <label class="block text-xs font-semibold text-slate-300">${labelText}</label>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <span class="text-[10px] text-slate-400 block mb-0.5">${currentLang === 'ru' ? 'Целые (inches)' : 'Whole Inches'}</span>
                            <input type="number" id="${idPrefix}-whole" value="${defaultWhole}" min="0" max="300" oninput="calculate()" 
                                class="w-full bg-slate-950 border border-slate-750 rounded-xl px-3 py-2.5 text-slate-100 mono text-sm focus:outline-none focus:border-amber-500 transition-all">
                        </div>
                        <div>
                            <span class="text-[10px] text-slate-400 block mb-0.5">${currentLang === 'ru' ? 'Дробь (1/16)' : 'Fraction'}</span>
                            <select id="${idPrefix}-frac" onchange="calculate()" 
                                class="w-full bg-slate-950 border border-slate-750 rounded-xl px-2.5 py-2.5 text-slate-100 mono text-sm focus:outline-none focus:border-amber-500 transition-all">
                                ${optionsHTML}
                            </select>
                        </div>
                    </div>
                </div>
            `;
        }

        function getInputValue(idPrefix) {
            const wholeEl = document.getElementById(`${idPrefix}-whole`);
            const fracEl = document.getElementById(`${idPrefix}-frac`);
            if (!wholeEl || !fracEl) return 0;
            return parseFloat(wholeEl.value || 0) + parseFloat(fracEl.value || 0);
        }

        // --- Initialization & Navigation ---
        function setLang(lang) {
            currentLang = lang;
            document.getElementById('lang-btn-ru').className = lang === 'ru' ? 'px-3 py-1 text-xs font-bold rounded-lg transition-all bg-amber-500 text-slate-950 shadow' : 'px-3 py-1 text-xs font-bold rounded-lg transition-all text-slate-400 hover:text-slate-200';
            document.getElementById('lang-btn-en').className = lang === 'en' ? 'px-3 py-1 text-xs font-bold rounded-lg transition-all bg-amber-500 text-slate-950 shadow' : 'px-3 py-1 text-xs font-bold rounded-lg transition-all text-slate-400 hover:text-slate-200';
            
            // Update static texts
            document.getElementById('app-title').innerText = i18n[lang].title;
            document.getElementById('app-subtitle').innerText = i18n[lang].subtitle;
            document.getElementById('btn-copy-text').innerText = i18n[lang].copyPlan;
            document.getElementById('label-conduit-size').innerText = i18n[lang].conduitSize;
            document.getElementById('results-heading').innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>${i18n[lang].resultsHeading}`;
            document.getElementById('instructions-title').innerHTML = `<svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>${i18n[lang].instructionsTitle}`;
            document.getElementById('diagram-heading').innerHTML = `<svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>${i18n[lang].diagramHeading}`;

            // Update tabs
            for (let t of ['stub', 'offset', 'saddle3', 'saddle4', 'spatial3d']) {
                document.getElementById(`tab-btn-${t}`).innerText = i18n[lang].tabs[t];
            }

            renderInputsForTab(currentTab);
        }

        function switchTab(tab) {
            currentTab = tab;
            for (let t of ['stub', 'offset', 'saddle3', 'saddle4', 'spatial3d']) {
                const btn = document.getElementById(`tab-btn-${t}`);
                if (t === tab) {
                    btn.className = "tab-btn px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition-all whitespace-nowrap bg-amber-500 text-slate-950 shadow-md";
                } else {
                    btn.className = "tab-btn px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition-all whitespace-nowrap bg-slate-800 text-slate-400 hover:text-slate-200 hover:bg-slate-750";
                }
            }
            renderInputsForTab(tab);
        }

        function setConduitSize(size) {
            conduitSize = size;
            for (let s of ['1/2', '3/4', '1', '1-1/4']) {
                const btn = document.getElementById(`size-${s}`);
                if (s === size) {
                    btn.className = "conduit-size-btn py-2.5 rounded-xl font-bold text-xs border border-slate-700 bg-amber-500 text-slate-950 transition-all";
                } else {
                    btn.className = "conduit-size-btn py-2.5 rounded-xl font-bold text-xs border border-slate-700 bg-slate-800 text-slate-300 transition-all";
                }
            }
            calculate();
        }

        // --- Render Inputs based on active tab ---
        function renderInputsForTab(tab) {
            const container = document.getElementById('calculator-inputs');
            let html = '';
            const L = i18n[currentLang].labels;

            if (tab === 'stub') {
                html += `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4 shadow-lg">
                        <h3 class="text-xs font-bold text-amber-400 uppercase tracking-wider">${i18n[currentLang].tabs.stub}</h3>
                        ${renderImperialInput('stub-h', L.stubHeight, 24, 0)}
                    </div>
                `;
            } else if (tab === 'offset') {
                html += `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4 shadow-lg">
                        <h3 class="text-xs font-bold text-amber-400 uppercase tracking-wider">${i18n[currentLang].tabs.offset}</h3>
                        ${renderImperialInput('off-rise', L.offsetRise, 6, 0)}
                        
                        <div class="space-y-1.5">
                            <label class="block text-xs font-semibold text-slate-300">${L.angle}</label>
                            <select id="off-angle" onchange="calculate()" class="w-full bg-slate-950 border border-slate-750 rounded-xl px-3 py-2.5 text-slate-100 mono text-sm focus:outline-none focus:border-amber-500 transition-all">
                                <option value="10">10° (Shrink: 1/16" per 1")</option>
                                <option value="15">15° (Shrink: 1/8" per 1")</option>
                                <option value="22.5">22.5° (Shrink: 3/16" per 1")</option>
                                <option value="30" selected>30° (Shrink: 1/4" per 1")</option>
                                <option value="45">45° (Shrink: 3/8" per 1")</option>
                                <option value="60">60° (Shrink: 1/2" per 1")</option>
                            </select>
                        </div>

                        <div class="space-y-1.5 pt-2 border-t border-slate-800">
                            <label class="block text-xs font-semibold text-amber-400">${L.mode}</label>
                            <div class="grid grid-cols-2 gap-2">
                                <button onclick="setOffsetMode('A')" id="off-mode-A" class="py-2 px-3 rounded-xl text-xs font-bold border border-amber-500 bg-amber-500 text-slate-950 transition-all">${L.modeA}</button>
                                <button onclick="setOffsetMode('B')" id="off-mode-B" class="py-2 px-3 rounded-xl text-xs font-bold border border-slate-700 bg-slate-800 text-slate-300 transition-all">${L.modeB}</button>
                            </div>
                        </div>

                        <div id="obstacle-input-container" class="space-y-4 pt-2 hidden">
                            ${renderImperialInput('off-obst', L.obstacleDist, 36, 0)}
                        </div>

        let offsetMode = 'A';
        function setOffsetMode(mode) {
            offsetMode = mode;
            const btnA = document.getElementById('off-mode-A');
            const btnB = document.getElementById('off-mode-B');
            const obstCont = document.getElementById('obstacle-input-container');
            
            if (mode === 'A') {
                btnA.className = "py-2 px-3 rounded-xl text-xs font-bold border border-amber-500 bg-amber-500 text-slate-950 transition-all";

            } else {
                btnB.className = "py-2 px-3 rounded-xl text-xs font-bold border border-amber-500 bg-amber-500 text-slate-950 transition-all";
                btnA.className = "py-2 px-3 rounded-xl text-xs font-bold border border-slate-700 bg-slate-800 text-slate-300 transition-all";
                obstCont.classList.remove('hidden');
            }
            calculate();
        }

        // --- Core Calculation Engine ---
        function calculate() {
            const spec = benderSpecs[conduitSize] || benderSpecs['1/2'];
            const resultsGrid = document.getElementById('results-grid');

            let resCardsHTML = '';

            if (currentTab === 'stub') {

                resCardsHTML = `
                    <div class="bg-slate-950/80 border border-slate-800/80 rounded-xl p-3 text-center">

                    </div>
                    <div class="bg-slate-950/80 border border-slate-800/80 rounded-xl p-3 text-center">
                        <span class="text-[10px] text-slate-400 block uppercase mb-1">Высота стуба</span>
                        <span class="text-xl font-bold text-slate-200 mono">${formatInches(stubH)}</span>
                    </div>
                    <div class="bg-slate-950/80 border border-slate-800/80 rounded-xl p-3 text-center">

                        <span class="text-xl font-bold text-slate-200 mono">90°</span>
                    </div>
                `;

                instructionsHTML = `
                    <div class="flex items-start gap-2.5">

                        <p>Отмерьте от конца трубы <b>${formatInches(mark1)}</b> и поставьте четкую отметку карандашом (стрелка бендера).</p>
                    </div>
                    <div class="flex items-start gap-2.5">
                        <span class="bg-amber-500 text-slate-950 font-bold text-[10px] w-5 h-5 rounded-full flex items-center justify-center shrink-0 mt-0.5">2</span>
                        <p>Вставьте трубу в бендер так, чтобы хвостовик смотрел назад, а отметка совпала со <b>стрелкой (Arrow)</b> бендера. Убедитесь, что труба в желобе ровно.</p>
                    </div>
                    <div class="flex items-start gap-2.5">
                        <span class="bg-amber-500 text-slate-950 font-bold text-[10px] w-5 h-5 rounded-full flex items-center justify-center shrink-0 mt-0.5">3</span>

                    </div>
                `;

                svgHTML = `
                    <svg viewBox="0 0 400 180" class="w-full h-48">
                        <path d="M 50 140 L 250 140 A 40 40 0 0 0 290 100 L 290 40" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
                        <circle cx="210" cy="140" r="4" fill="#38bdf8"/>
                        <text x="200" y="165" fill="#38bdf8" font-size="11" class="mono">Mark: ${formatInches(mark1)}</text>
                        <path d="M 290 30 L 270 30" stroke="#94a3b8" stroke-dasharray="2,2"/>
                        <text x="300" y="70" fill="#94a3b8" font-size="11" class="mono">Stub: ${formatInches(stubH)}</text>
                    </svg>
                `;

            } else if (currentTab === 'offset') {
                const rise = getInputValue('off-rise');
                const angle = parseFloat(document.getElementById('off-angle').value);
                const shrinkFactor = offsetShrinkTable[angle] || 0.25;
                const csc = cscTable[angle] || 2.0;
                const mult = offsetMultiplierTable[angle] || 1.732;

                const distanceBetweenBends = rise * mult;
                const totalShrink = rise * shrinkFactor;

                let mark1, mark2;
                if (offsetMode === 'A') {
                    // From end: start at 6" (standard starting allowance) + totalShrink? No, standard starting mark + shrink adjustment.
                    // Actually, standard offset starting mark is arbitrary (e.g. 6"), and mark 2 is mark1 + distanceBetweenBends.
                    mark1 = 6.0;
                    mark2 = mark1 + distanceBetweenBends;
                } else {
                    const obstCenter = getInputValue('off-obst');
                    // Mode B: Obstacle center is at obstCenter.
                    // Center of offset aligns with obstacle center. Mark 1 is Obstacle Center - (Distance Between Bends / 2) + Shrink adjustment?
                    // Precise trade rule for Obstacle Center offset:
                    // Center of offset is placed at obstacle center.
                    // Mark 1 = Obstacle Center - (Distance / 2) + (Total Shrink / 2) -> Let's use clean standard calculation:
                    let halfDist = distanceBetweenBends / 2;
                    mark1 = obstCenter - halfDist + totalShrink;
                    mark2 = mark1 + distanceBetweenBends;
                }

                resCardsHTML = `
                    <div class="bg-slate-950/80 border border-slate-800/80 rounded-xl p-3 text-center">

                    <div class="bg-slate-950/80 border border-slate-800/80 rounded-xl p-3 text-center">

                        <span class="text-[10px] text-slate-400 block uppercase mb-1">Между метками</span>
                        <span class="text-xl font-bold text-slate-200 mono">${formatInches(distanceBetweenBends)}</span>
                    </div>
                    <div class="bg-slate-950/80 border border-slate-800/80 rounded-xl p-3 text-center">

                `;

                    </div>
                    <div class="flex items-start gap-2.5">
                        <span class="bg-amber-500 text-slate-950 font-bold text-[10px] w-5 h-5 rounded-full flex items-center justify-center shrink-0 mt-0.5">2</span>
                        <p><b>Первый гиб:</b> Согните по отметке 1 на угол <b>${angle}°</b>, используя <b>стрелку (Arrow)</b> бендера. Голова бендера направлена к концу трубы (Face Up).</p>

                    <div class="flex items-start gap-2.5">
                        <span class="bg-amber-500 text-slate-950 font-bold text-[10px] w-5 h-5 rounded-full flex items-center justify-center shrink-0 mt-0.5">3</span>
                        <p><b>Второй гиб:</b> Переверните трубу на 180° (Flip / Roll). Согните по отметке 2 на угол <b>${angle}°</b> по <b>стрелке (Arrow)</b>, чтобы выровнять плоскость оффсета.</p>
                    </div>
                `;

                svgHTML = `
                    <svg viewBox="0 0 400 180" class="w-full h-48">
                        <path d="M 30 140 L 120 140 L 180 80 L 370 80" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
                        <circle cx="120" cy="140" r="4" fill="#38bdf8"/>
                        <circle cx="180" cy="80" r="4" fill="#38bdf8"/>
                        <text x="100" y="165" fill="#38bdf8" font-size="10" class="mono">M1: ${formatInches(mark1)}</text>
                        <text x="170" y="65" fill="#38bdf8" font-size="10" class="mono">M2: ${formatInches(mark2)}</text>
                        <text x="240" y="110" fill="#94a3b8" font-size="11" class="mono">Rise: ${formatInches(rise)}</text>
                    </svg>
                `;

            } else if (currentTab === 'saddle3' || currentTab === 'saddle4') {
                const depth = getInputValue('sad-depth');
                const width = getInputValue('sad-width');
                const angle = parseFloat(document.getElementById('sad-angle').value);
                
                // 3-Point Saddle calculations
                // Center bend angle is double outer bends (e.g. 30° center, 15° outer)
                const centerMultiplier = 2.0; // multiplier for center bend distance
                const centerMark = width;
                const shrinkFactor = angle === 30 ? 0.25 : (angle === 22.5 ? 0.1875 : 0.375);
                const shrink = depth * shrinkFactor * 2;
                const spread = depth * (angle === 30 ? 2 : (angle === 22.5 ? 2.6 : 1.4));

                resCardsHTML = `
                    <div class="bg-slate-950/80 border border-slate-800/80 rounded-xl p-3 text-center">
                        <span class="text-[10px] text-slate-400 block uppercase mb-1">Центральная отметка</span>

                    </div>
                    <div class="bg-slate-950/80 border border-slate-800/80 rounded-xl p-3 text-center">

                instructionsHTML = `

                    <div class="flex items-start gap-2.5">
                        <span class="bg-amber-500 text-slate-950 font-bold text-[10px] w-5 h-5 rounded-full flex items-center justify-center shrink-0 mt-0.5">3</span>
                        <p>Согните центральный гиб на угол <b>${angle * 2}°</b> по <b>риске (Rim Notch)</b> бендера. Затем согните боковые гибы на угол <b>${angle}°</b> по <b>стрелке (Arrow)</b>, развернув трубу на 180°.</p>

                // True 3D spatial calculations
                const dOffset = Math.sqrt(y * y + z * z);
                const hyp3d = Math.sqrt(x * x + y * y + z * z);
                const rollAngle = Math.atan2(z, y) * (180 / Math.PI);

                resCardsHTML = `
                    <div class="bg-slate-950/80 border border-slate-800/80 rounded-xl p-3 text-center">

                svgHTML = `

                            <line x1="0" y1="0" x2="-100" y2="40" stroke="#334155" stroke-dasharray="3,3" stroke-width="1.5" />

                            <path d="M 120 -40 L 20 -60 L -100 40" fill="none" stroke="#1e293b" stroke-width="1.5"/>

                            <polygon points="0,0 0,-100 -100,-40 -100,60" fill="rgba(56, 189, 248, 0.03)" stroke="#334155" stroke-width="1.5"/>

                            <!-- Labels -->

                            <text x="30" y="-30" fill="#f59e0b" font-weight="bold" font-size="11" class="mono">3D Hyp: ${formatInches(hyp3d)}</text>
                        </g>
                    </svg>
                `;
            }

            resultsGrid.innerHTML = resCardsHTML;

        }

        // --- Copy Plan to Clipboard ---
        function copyPlanToClipboard() {
            const textToCopy = `Conduit Bending Plan (${conduitSize}" EMT):\n` +
                Array.from(document.querySelectorAll('#results-grid > div')).map(el => {
                    const label = el.querySelector('span:nth-child(1)').innerText;
                    const val = el.querySelector('span:nth-child(2)').innerText;
                    return `${label}: ${val}`;
                }).join('\n');
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert(currentLang === 'ru' ? 'План гибки скопирован в буфер обмена!' : 'Bending plan copied to clipboard!');
            });
        }

        // Initial setup on load
        window.onload = function() {
            setLang('ru');
        };
    </script>
