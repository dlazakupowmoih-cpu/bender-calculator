<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Eto Bender Suka</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #374151;
            --warning: #f59e0b;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .bender-logo-container {
            width: 90px;
            height: 90px;
            background: radial-gradient(circle, #1f2937 0%, #030712 100%);
            border: 2px solid var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
            animation: pulse-glow 3s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 10px rgba(59, 130, 246, 0.3); }
            100% { box-shadow: 0 0 20px rgba(59, 130, 246, 0.7); }
        }

        header h1 {
            font-size: 1.6rem;
            color: #60a5fa;
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .top-panel {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 12px;
        }

        .lang-select-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 4px 10px;
            border-radius: 8px;
        }

        .lang-select-wrap label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin: 0;
        }

        .lang-select-wrap select {
            background: transparent;
            border: none;
            color: #60a5fa;
            font-weight: bold;
            padding: 4px;
            cursor: pointer;
        }

        .tabs-container {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .tab-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            border-color: var(--accent);
            color: var(--text-main);
        }

        .tab-btn.active {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 0.95rem;
            margin-bottom: 12px;
            color: #93c5fd;
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .form-group {
            flex: 1;
            margin-bottom: 10px;
        }

        .inch-split {
            display: flex;
            gap: 6px;
        }
        .inch-split input { flex: 2; }
        .inch-split select { flex: 3; }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        select, input {
            width: 100%;
            background-color: #030712;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        .btn:hover { background-color: var(--accent-hover); }

        .btn-secondary {
            background-color: #374151;
            margin-top: 8px;
        }
        .btn-secondary:hover { background-color: #4b5563; }

        .results {
            background-color: rgba(59, 130, 246, 0.08);
            border: 1px solid var(--accent);
            border-radius: 10px;
            padding: 12px;
            margin-top: 14px;
        }

        .results h3 {
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #93c5fd;
        }

        .result-item, .result-block, .pipe-result-card {
            font-size: 0.85rem;
            margin-bottom: 8px;
            border-bottom: 1px dashed rgba(255,255,255,0.08);
            padding-bottom: 6px;
            line-height: 1.5;
        }

        .instructions {
            background-color: rgba(245, 158, 11, 0.08);
            border: 1px solid var(--warning);
            border-radius: 10px;
            padding: 12px;
            margin-top: 12px;
            font-size: 0.85rem;
            line-height: 1.5;
        }
        .instructions h4 { color: #fbbf24; margin-bottom: 8px; font-size: 0.9rem; }
        .instructions ol { padding-left: 18px; }
        .instructions li { margin-bottom: 8px; }

        .bend-item, .pipe-item {
            background: rgba(3, 7, 18, 0.6);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 14px;
            position: relative;
        }
        .bend-item.error, .pipe-item.error {
            border-color: var(--danger);
            background: rgba(239, 68, 68, 0.05);
        }
        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 0.9rem;
            color: #60a5fa;
        }
        .remove-btn {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
        }
        .remove-btn:hover { background: rgba(239, 68, 68, 0.4); }

        .slider-group {
            background: rgba(59, 130, 246, 0.05);
            border: 1px dashed var(--accent);
            padding: 10px;
            border-radius: 8px;
            margin-top: 8px;
            margin-bottom: 10px;
        }
        .slider-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .slider-row input[type="range"] { flex: 3; accent-color: var(--accent); cursor: pointer; }
        .slider-row input[type="number"] { flex: 1; text-align: center; font-weight: bold; color: #60a5fa; }
        
        .error-banner {
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--danger);
            color: #fca5a5;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="bender-logo-container">
            <svg width="70" height="70" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M10 55 C 25 55, 30 45, 38 48" stroke="#9ca3af" stroke-width="4" stroke-linecap="round"/>
                <path d="M90 55 C 75 55, 70 45, 62 48" stroke="#9ca3af" stroke-width="4" stroke-linecap="round"/>
                <path d="M15 70 L 45 70 C 52 70, 55 65, 52 55 L 50 35" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/>
                <line x1="50" y1="12" x2="50" y2="24" stroke="#d1d5db" stroke-width="3"/>
                <circle cx="50" cy="10" r="3" fill="#ef4444"/>
                <rect x="34" y="24" width="32" height="34" rx="4" fill="#9ca3af" stroke="#4b5563" stroke-width="2"/>
                <circle cx="43" cy="35" r="7" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
                <circle cx="57" cy="35" r="7" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
                <circle cx="43" cy="35" r="2" fill="#000000"/>
                <circle cx="57" cy="35" r="2" fill="#000000"/>
                <rect x="41" y="46" width="18" height="8" rx="1" fill="#4b5563"/>
                <line x1="47" y1="46" x2="47" y2="54" stroke="#1f2937" stroke-width="1.5"/>
                <line x1="53" y1="43" x2="53" y2="54" stroke="#1f2937" stroke-width="1.5"/>
                <path d="M54 50 L 68 47" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
                <circle cx="69" cy="46.5" r="2" fill="#f97316"/>
                <path d="M70 45 C 72 43, 71 40, 73 38" stroke="#e5e7eb" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
            </svg>
        </div>
        <h1 id="app-heading">Eto Bender Suka</h1>
        <p id="app-subheading">Профессиональный калькулятор трубогиба</p>
    </header>

    <div class="top-panel">
        <div class="lang-select-wrap">
            <label id="lbl-lang">Язык / Language:</label>
            <select id="lang-selector" onchange="changeLanguage(this.value)">
                <option value="ru" selected>Русский</option>
                <option value="uk">Українська</option>
                <option value="en">English</option>
            </select>
        </div>
    </div>

    <div class="tabs-container">
        <button class="tab-btn active" id="tab-btn-1" onclick="switchTab(event, 'tab-single')">1. Одиночный гиб</button>
        <button class="tab-btn" id="tab-btn-2" onclick="switchTab(event, 'tab-angle')">2. Угол по катетам</button>
        <button class="tab-btn" id="tab-btn-3" onclick="switchTab(event, 'tab-multirun')">3. Multi-Run (Цепочка)</button>
        <button class="tab-btn" id="tab-btn-4" onclick="switchTab(event, 'tab-parallel')">4. Параллельные трассы</button>
    </div>

    <!-- ВКЛАДКА 1 -->
    <div id="tab-single" class="tab-content active">
        <div class="card">
            <div class="section-title" id="s-sec-title1">Параметры трубы и геометрии</div>
            <div class="form-row">
                <div class="form-group">
                    <label id="lbl-conduit-type">Тип трубы</label>
                    <select id="s-conduit-type" onchange="updateSizeOptions('s')">
                        <option value="emt">EMT</option>
                        <option value="imc">IMC</option>
                        <option value="rigid">Rigid</option>
                    </select>
                </div>
                <div class="form-group">
                    <label id="lbl-conduit-size">Размер трубы</label>
                    <select id="s-conduit-size"></select>
                </div>
            </div>

            <div class="form-group">
                <label id="lbl-bend-type">Вид изгиба</label>
                <select id="s-bend-type" onchange="toggleSingleInputs()">
                    <option value="stub">90° Stub-up (Прямой угол)</option>
                    <option value="offset">Offset (Классический оффсет)</option>
                    <option value="offset_box">Offset to Box (Заводка в коробку)</option>
                    <option value="saddle3" selected>3-Point Saddle (Седло 3 точки)</option>
                    <option value="saddle4">4-Point Saddle (Седло 4 точки / Обход балки)</option>
                </select>
            </div>

            <div class="form-group" id="s-angle-group-container">
                <label id="lbl-bend-angle">Угол изгиба оффсета / седла</label>
                <select id="s-bend-angle" onchange="handleSingleAngleChange()">
                    <option value="10" id="opt-ang-10">10° (плавный)</option>
                    <option value="22.5" id="opt-ang-22">22.5° (стандарт)</option>
                    <option value="30" id="opt-ang-30" selected>30° (ходовой)</option>
                    <option value="45" id="opt-ang-45">45° (крутой)</option>
                    <option value="custom" id="opt-ang-custom">🛠 Свой угол...</option>
                </select>
                <div id="s-custom-slider-wrap" class="slider-group" style="display: none;">
                    <label><span id="lbl-custom-angle">Кастомный угол</span>: <span id="s-slider-val-lbl">30</span>°</label>
                    <div class="slider-row">
                        <input type="range" id="s-custom-slider" min="1" max="89" step="0.5" value="30" oninput="syncSingleSlider(this.value)">
                        <input type="number" id="s-custom-num" min="1" max="89" step="0.5" value="30" oninput="syncSingleNum(this.value)">
                    </div>
                </div>
            </div>

            <div class="form-group" id="s-val1-group">
                <label id="s-lbl-primary">Центр препятствия со стены</label>
                <div class="inch-split">
                    <input type="number" id="s-v1-whole" value="36" min="0">
                    <select id="s-v1-frac" class="frac-select"></select>
                </div>
            </div>

            <div class="form-group" id="s-val2-group">
                <label id="s-lbl-secondary">Высота препятствия (Depth со стены)</label>
                <div class="inch-split">
                    <input type="number" id="s-v2-whole" value="4" min="0">
                    <select id="s-v2-frac" class="frac-select"></select>
                </div>
            </div>

            <div class="form-group" id="s-val3-group" style="display:none;">
                <label id="s-lbl-third">Ширина препятствия (Flat Width)</label>
                <div class="inch-split">
                    <input type="number" id="s-v3-whole" value="6" min="0">
                    <select id="s-v3-frac" class="frac-select"></select>
                </div>
            </div>

            <button class="btn" id="btn-calc-single" onclick="calculateSingleBend()">Рассчитать разметку</button>
            
            <div id="s-results" class="results" style="display:none;"></div>
            <div id="s-instructions" class="instructions" style="display:none;"></div>
        </div>
    </div>

    <!-- ВКЛАДКА 2 -->
    <div id="tab-angle" class="tab-content">
        <div class="card">
            <div class="section-title" id="a-sec-title1">Введите размеры (Rise / Run)</div>
            <div class="form-group">
                <label id="lbl-rise">Высота подъема (Rise / Opposite)</label>
                <div class="inch-split">
                    <input type="number" id="a-rise-whole" value="4" min="0" oninput="calculateAngle()">
                    <select id="a-rise-frac" class="frac-select" onchange="calculateAngle()"></select>
                </div>
            </div>
            <div class="form-group">
                <label id="lbl-run">Горизонтальное расстояние (Run / Adjacent)</label>
                <div class="inch-split">
                    <input type="number" id="a-run-whole" value="12" min="0" oninput="calculateAngle()">
                    <select id="a-run-frac" class="frac-select" onchange="calculateAngle()"></select>
                </div>
            </div>
            <button class="btn" id="btn-calc-angle" onclick="calculateAngle()">Пересчитать угол</button>
        </div>

        <div class="card" id="a-results-card" style="display:none;">
            <div class="section-title" id="a-sec-title2">Результаты расчёта</div>
            <div class="results" id="a-results-content"></div>
        </div>
    </div>

    <!-- ВКЛАДКА 3 -->
    <div id="tab-multirun" class="tab-content">
        <div class="card">
            <div class="section-title" id="m-sec-title1">1. Параметры трубы</div>
            <div class="form-row">
                <div class="form-group">
                    <label id="lbl-m-type">Тип трубы</label>
                    <select id="m-conduit-type" onchange="updateMultiSizes()">
                        <option value="emt">EMT</option>
                        <option value="imc">IMC</option>
                        <option value="rigid">Rigid</option>
                    </select>
                </div>
                <div class="form-group">
                    <label id="lbl-m-size">Размер трубы</label>
                    <select id="m-conduit-size"></select>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="section-title">
                <span id="m-sec-title2">2. Цепочка изгибов на трубе (Multi-Run)</span>
                <button class="btn" style="width: auto; padding: 6px 12px; font-size: 0.8rem;" id="btn-add-bend" onclick="addMultiItem()">+ Добавить гиб</button>
            </div>
            <div id="m-bends-container"></div>
            <button class="btn btn-secondary" id="btn-add-bend-sec" onclick="addMultiItem()">+ Добавить следующий фитинг в цепочку</button>
        </div>

        <div class="card">
            <button class="btn" id="btn-calc-multi" onclick="calculateMultiRun()">Рассчитать Multi-Run разметку</button>
            <div id="m-error-container"></div>
            <div id="m-results" class="results" style="display:none;"></div>
            <div id="m-instructions" class="instructions" style="display:none;"></div>
        </div>
    </div>

    <!-- ВКЛАДКА 4 -->
    <div id="tab-parallel" class="tab-content">
        <div class="card">
            <div class="section-title" id="p-sec-title1">1. Общие параметры группы труб</div>
            <div class="form-row">
                <div class="form-group">
                    <label id="lbl-p-mode">Режим отступов между трубами</label>
                    <select id="p-spacing-mode" onchange="toggleParallelSpacing()">
                        <option value="uniform" id="opt-p-uni">Одинаковый (автоматический шаг)</option>
                        <option value="custom" id="opt-p-cust">Кастомный (указывается для каждой трубы)</option>
                    </select>
                </div>
                <div class="form-group" id="p-uniform-gap-group">
                    <label id="lbl-p-gap">Базовый отступ между осями</label>
                    <div class="inch-split">
                        <input type="number" id="p-gap-whole" value="3" min="0">
                        <select id="p-gap-frac" class="frac-select"></select>
                    </div>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label id="lbl-p-stack">Направление отсчета в пакете</label>
                    <select id="p-stack-direction">
                        <option value="bottom-to-top" id="opt-stack-bot">Снизу вверх (1-я труба — база)</option>
                        <option value="top-to-bottom" id="opt-stack-top">Сверху вниз (последняя труба — база)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label id="lbl-p-fitting">Тип изгиба / фитинга</label>
                    <select id="p-fitting-type" onchange="toggleParallelFittingInputs()">
                        <option value="single" id="opt-pf-single">Single Bend / Kick (Одиночный угол)</option>
                        <option value="offset" id="opt-pf-offset">Классический Offset (Оффсет)</option>
                        <option value="saddle3" id="opt-pf-s3">3-Point Saddle (Седло 3 точки)</option>
                        <option value="saddle4" id="opt-pf-s4">4-Point Saddle (Седло 4 точки)</option>
                        <option value="stub" id="opt-pf-stub">90° Stub-up (Параллельные углы 90°)</option>
                    </select>
                </div>
            </div>

            <div class="form-row" style="margin-top: 10px;">
                <div class="form-group" id="p-group-v1">
                    <label id="p-lbl-v1">Базовая точка старта / Метка от торца</label>
                    <div class="inch-split">
                        <input type="number" id="p-v1-whole" value="24" min="0">
                        <select id="p-v1-frac" class="frac-select"></select>
                    </div>
                </div>
                <div class="form-group" id="p-group-v2">
                    <label id="p-lbl-v2">Требуемый подъем (Rise / Depth)</label>
                    <div class="inch-split">
                        <input type="number" id="p-v2-whole" value="4" min="0">
                        <select id="p-v2-frac" class="frac-select"></select>
                    </div>
                </div>
                <div class="form-group" id="p-group-angle">
                    <label id="lbl-p-angle">Угол изгиба</label>
                    <select id="p-base-angle">
                        <option value="10">10°</option>
                        <option value="22.5">22.5°</option>
                        <option value="30" selected>30°</option>
                        <option value="45">45°</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="section-title">
                <span id="p-sec-title2">2. Спецификация труб в пачке</span>
                <button class="btn" style="width: auto; padding: 6px 12px; font-size: 0.8rem;" id="btn-add-pipe" onclick="addParallelPipe()">+ Добавить трубу</button>
            </div>
            <div id="p-pipes-container"></div>
            <button class="btn btn-secondary" id="btn-add-pipe-sec" onclick="addParallelPipe()">+ Добавить еще одну трубу в пакет</button>
        </div>

        <div class="card">
            <button class="btn" id="btn-calc-parallel" onclick="calculateParallelRun()">Рассчитать трассу</button>
            <div id="p-results" class="results" style="display:none;"></div>
        </div>
    </div>

    <script>
        const i18n = {
            ru: {
                appSub: "Профессиональный калькулятор трубогиба",
                langLabel: "Язык / Language:",
                tab1: "1. Одиночный гиб",
                tab2: "2. Угол по катетам",
                tab3: "3. Multi-Run (Цепочка)",
                tab4: "4. Параллельные трассы",
                sSecTitle1: "Параметры трубы и геометрии",
                lblConduitType: "Тип трубы",
                lblConduitSize: "Размер трубы",
                lblBendType: "Вид изгиба",
                lblBendAngle: "Угол изгиба оффсета / седла",
                optAng10: "10° (плавный)",
                optAng22: "22.5° (стандарт)",
                optAng30: "30° (ходовой)",

        function getSplitVal(wholeId, fracId) {
            const whole = parseFloat(document.getElementById(wholeId).value) || 0;
            const frac = parseFloat(document.getElementById(fracId).value) || 0;
            return whole + frac;
        }

        function formatInches(inches) {
            if (inches < 0) inches = 0;
            const totalSixteenths = Math.round(inches * 16);
            const whole = Math.floor(totalSixteenths / 16);
            let rem = totalSixteenths % 16;
            if (rem === 0) return whole > 0 ? `${whole}"` : `0"`;
            let num = rem, den = 16;
            while (num % 2 === 0 && den % 2 === 0) { num /= 2; den /= 2; }
            return whole === 0 ? `${num}/${den}"` : `${whole} ${num}/${den}"`;
        }

        function updateSizeOptions(prefix) {
            const conduit = document.getElementById(`${prefix}-conduit-type`).value;
            const sizeSelect = document.getElementById(`${prefix}-conduit-size`);
            const curSize = sizeSelect.value;
            const specs = conduitSpecs[conduit];
            let html = '';
            for (let sz in specs) {
                let sel = (sz === curSize || (curSize === '' && sz === '3/4')) ? 'selected' : '';
                html += `<option value="${sz}" data-takeup="${specs[sz].takeup}" data-clr="${specs[sz].clr}" ${sel}>${sz}" (Take-up: ${specs[sz].takeup}", CLR: ${specs[sz].clr}")</option>`;
            }
            sizeSelect.innerHTML = html;
        }

        function getActiveSpecs(prefix) {
            const sizeSel = document.getElementById(`${prefix}-conduit-size`);
            if (!sizeSel || sizeSel.options.length === 0) return { takeup: 6, clr: 4.375 };
            const opt = sizeSel.options[sizeSel.selectedIndex];
            return {
                takeup: parseFloat(opt.getAttribute('data-takeup')) || 6,
                clr: parseFloat(opt.getAttribute('data-clr')) || 4.375
            };
        }

        function toggleSingleInputs() {
            const type = document.getElementById('s-bend-type').value;
            const lblP = document.getElementById('s-lbl-primary');
            const lblS = document.getElementById('s-lbl-secondary');
            const group2 = document.getElementById('s-val2-group');
            const group3 = document.getElementById('s-val3-group');
            const angleContainer = document.getElementById('s-angle-group-container');
            const t = i18n[currentLang];

            group2.style.display = 'block';
            group3.style.display = 'none';
            angleContainer.style.display = (type === 'stub') ? 'none' : 'block';

            if (type === 'stub') {
                lblP.innerText = t.sLblStub;
                group2.style.display = 'none';
            } else if (type === 'offset' || type === 'offset_box') {
                lblP.innerText = t.sLblOffCenter;
                lblS.innerText = t.sLblOffDepth;
            } else if (type === 'saddle3') {
                lblP.innerText = t.sLblSadCenter;
                lblS.innerText = t.sLblSadHeight;
            } else if (type === 'saddle4') {
                lblP.innerText = t.sLblSadCenter;
                lblS.innerText = t.sLblSadHeight;
                group3.style.display = 'block';
            }

        function calculateSingleBend() {
            const specs = getActiveSpecs('s');
            const type = document.getElementById('s-bend-type').value;
            const val1 = getSplitVal('s-v1-whole', 's-v1-frac');
            const val2 = getSplitVal('s-v2-whole', 's-v2-frac');
            const val3 = getSplitVal('s-v3-whole', 's-v3-frac');

            let resHtml = `<div class="result-item">⚙️ Параметры головки: Take-up = <b>${specs.takeup}"</b> | Радиус загиба (CLR) = <b>${specs.clr}"</b></div>`;
            let instrHtml = '';

            if (type === 'stub') {
                const mark = val1 - specs.takeup;
                resHtml += `<h3>📏 Куда ставить метку:</h3><div class="result-item">Черти риску на трубе ровно на отметке: <b>${formatInches(mark)}</b> от торца трубы.</div>`;
                instrHtml += `<h4>👶 Пошаговая инструкция для чайников:</h4><ol>
                    <li>Возьми рулетку и приложи её к <b>торцу (концу)</b> трубы.</li>
                    <li>Отмерь по рулетке расстояние <b>${formatInches(mark)}</b> и поставь четкую риску маркером (это будет метка под сгиб).</li>
                    <li>Вставь трубу в трубогиб так, чтобы твоя риска совпала со <b>стрелкой (Arrow)</b> на голове трубогиба.</li>
                    <li>Убедись, что длинный хвост трубы смотрит в сторону ручки трубогиба, а короткий хвостик зажат. Надавливай ногой на упор и гни ровно до упора в <b>90 градусов</b>. Готово!</li>
                </ol>`;
            } else {
                const angleDeg = getSingleAngle();
                const rad = angleDeg * (Math.PI / 180);
                const multiplier = 1 / Math.sin(rad);
                const shrink = val2 * ((1 - Math.cos(rad)) / Math.sin(rad));
                const centerShiftCorrection = specs.clr * Math.tan(rad / 2);

                if (type === 'saddle3') {
                    const dist = val2 * multiplier;
                    const saddleShrink = 2 * shrink;
                    const m2 = val1 + saddleShrink;
                    const m1 = m2 - dist - centerShiftCorrection;
                    const m3 = m2 + dist + centerShiftCorrection;
                    resHtml += `<div class="result-item">Усадка трубы (Shrink): <b>${formatInches(saddleShrink)}</b></div>
                                <div class="result-item">Метки: М1 = <b>${formatInches(m1)}</b> | М2 (Центр) = <b>${formatInches(m2)}</b> | М3 = <b>${formatInches(m3)}</b></div>`;
                    instrHtml += `<h4>👶 Пошаговая инструкция для чайников:</h4><ol>
                        <li>Найди на стене центр препятствия (например, трубу или коробку) и поставь на полу/стене базовую отметку на расстоянии <b>${formatInches(val1)}</b> от начала трубы.</li>
                        <li>Нанеси на трубе три метки маркером: <b>М1</b>, <b>М2 (Центральная)</b> и <b>М3</b> на указанных выше расстояниях от торца трубы.</li>
                        <li><b>Шаг 1:</b> Гни центральную метку <b>М2</b> по <b>центральной риске</b> трубогиба на двойной угол (<b>${(angleDeg*2).toFixed(1)}°</b>).</li>
                        <li><b>Шаг 2:</b> Переверни трубу задом наперед и согни метки <b>М1</b> и <b>М3</b> по <b>стрелке</b> трубогиба на угол <b>${angleDeg}°</b>. Седло готово!</li>
                    </ol>`;
                } else if (type === 'saddle4') {
                    const totalShrink = 2 * shrink;
                    const adjustedCenter = val1 + totalShrink;
                    const dist = val2 * multiplier;
                    const halfWidth = val3 / 2;
                    const m2 = adjustedCenter - halfWidth;
                    const m3 = adjustedCenter + halfWidth;
                    const m1 = m2 - dist - centerShiftCorrection;
                    const m4 = m3 + dist + centerShiftCorrection;
                    resHtml += `<div class="result-item">Метки: М1 = <b>${formatInches(m1)}</b>, М2 = <b>${formatInches(m2)}</b>, М3 = <b>${formatInches(m3)}</b>, М4 = <b>${formatInches(m4)}</b></div>`;
                    instrHtml += `<h4>👶 Пошаговая инструкция для чайников:</h4><ol>
                        <li>Отмерь от торца трубы и поставь 4 метки: <b>М1</b>, <b>М2</b>, <b>М3</b> и <b>М4</b> на отмеченных расстояниях.</li>
                        <li>По очереди вставляй трубу в трубогиб каждым из четырех мест и делай загибы на угол <b>${angleDeg}°</b>, сверяясь с тем, чтобы все гибы смотрели в одну плоскость.</li>
                    </ol>`;
                } else {
                    const dist = val2 * multiplier;
                    const m1 = val1 + shrink - centerShiftCorrection;
                    const m2 = m1 + dist;
                    resHtml += `<div class="result-item">Метка 1 (М1) = <b>${formatInches(m1)}</b> | Метка 2 (М2) = <b>${formatInches(m2)}</b></div>`;
                    instrHtml += `<h4>👶 Пошаговая инструкция для чайников:</h4><ol>
                        <li>Возьми рулетку от начала трубы и поставь первую метку <b>М1</b> на расстоянии <b>${formatInches(m1)}</b>.</li>
                        <li>Поставь вторую метку <b>М2</b> на расстоянии <b>${formatInches(m2)}</b> от начала трубы.</li>
                        <li>Вставь трубу в трубогиб так, чтобы риска <b>М1</b> совпала со <b>стрелкой (Arrow)</b> трубогиба. Согни трубу на угол <b>${angleDeg}°</b>.</li>
                        <li>Поверни трубу ровно на 180 градусов (чтобы не уйти в другую плоскость), совмести метку <b>М2</b> со <b>скидочной риской (Rim Notch)</b> или стрелкой (в зависимости от техники) и сделай второй гиб на тот же угол <b>${angleDeg}°</b>. Оффсет готов!</li>
                    </ol>`;
                }
            }
            document.getElementById('s-results').style.display = 'block';
            document.getElementById('s-results').innerHTML = resHtml;
            document.getElementById('s-instructions').style.display = 'block';
            document.getElementById('s-instructions').innerHTML = instrHtml;
        }

        function calculateAngle() {
            const rise = getSplitVal('a-rise-whole', 'a-rise-frac');
            const run = getSplitVal('a-run-whole', 'a-run-frac');

            if (run === 0 && rise === 0) {
                document.getElementById('a-results-card').style.display = 'none';
                return;
            }

            let radians = run === 0 ? Math.PI / 2 : Math.atan(rise / run);
            let exactAngle = radians * (180 / Math.PI);
            let travel = Math.sqrt(rise * rise + run * run);

            const standards = [10, 22.5, 30, 45, 60, 90];
            let closest = standards.reduce((prev, curr) => (Math.abs(curr - exactAngle) < Math.abs(prev - exactAngle) ? curr : prev));

            let html = `
                <div class="result-item">Точный угол: <b style="color: #34d399;">${exactAngle.toFixed(2)}°</b></div>
                <div class="result-item">Ближайший стандартный угол: <b style="color: #60a5fa;">~${closest}°</b></div>
                <div class="result-item">Длина гипотенузы (Travel): <b>${formatInches(travel)}</b> (${travel.toFixed(2)}")</div>
            `;
            document.getElementById('a-results-content').innerHTML = html;
            document.getElementById('a-results-card').style.display = 'block';
        }

        let multiCounter = 0;
        function updateMultiSizes() {
            const conduit = document.getElementById('m-conduit-type').value;
            const sizeSelect = document.getElementById('m-conduit-size');
            const curSize = sizeSelect.value;
            const specs = conduitSpecs[conduit];
            let html = '';
            for (let sz in specs) {
                let sel = (sz === curSize || (curSize === '' && sz === '3/4')) ? 'selected' : '';
                html += `<option value="${sz}" data-takeup="${specs[sz].takeup}" data-clr="${specs[sz].clr}" ${sel}>${sz}" (Take-up: ${specs[sz].takeup}", CLR: ${specs[sz].clr}")</option>`;
            }
            sizeSelect.innerHTML = html;
        }

        function addMultiItem(defaultType = 'offset', defV1 = 12, defV2 = 4, defV3 = 6) {
            multiCounter++;
            const id = multiCounter;
            const container = document.getElementById('m-bends-container');
            const t = i18n[currentLang];
            const html = `
                <div class="bend-item" id="m-item-${id}" data-id="${id}">
                    <div class="item-header">
                        <span>Гиб #${id}</span>
                        <button class="remove-btn" onclick="document.getElementById('m-item-${id}').remove()">${t.mDel}</button>
                    </div>
                    <div class="form-group">
                        <label>${t.lblBendType}</label>
                        <select id="m-type-${id}" onchange="toggleMultiItemInputs(${id})">
                            <option value="stub" ${defaultType==='stub'?'selected':''}>${t.mStub}</option>
                            <option value="kick" ${defaultType==='kick'?'selected':''}>${t.mKick}</option>
                            <option value="offset" ${defaultType==='offset'?'selected':''}>${t.mOffset}</option>
                            <option value="saddle3" ${defaultType==='saddle3'?'selected':''}>${t.mSaddle3}</option>
                            <option value="saddle4" ${defaultType==='saddle4'?'selected':''}>${t.mSaddle4}</option>
                        </select>
                    </div>
                    <div class="form-group" id="m-angle-wrap-${id}">
                        <label>${t.lblBendAngle}</label>
                        <select id="m-angle-${id}">
                            <option value="10">10°</option>
                            <option value="22.5">22.5°</option>
                            <option value="30" selected>30°</option>
                            <option value="45">45°</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label id="m-lbl-v1-${id}">Позиция / Метка</label>
                        <div class="inch-split">
                            <input type="number" id="m-v1-whole-${id}" value="${defV1}" min="0">
                            <select id="m-v1-frac-${id}" class="frac-select"></select>
                        </div>
                    </div>
                    <div class="form-group" id="m-group-v2-${id}">
                        <label id="m-lbl-v2-${id}">Глубина / Подъем</label>
                        <div class="inch-split">
                            <input type="number" id="m-v2-whole-${id}" value="${defV2}" min="0">
                            <select id="m-v2-frac-${id}" class="frac-select"></select>
                        </div>
                    </div>
                    <div class="form-group" id="m-group-v3-${id}" style="display:none;">
                        <label>Ширина препятствия</label>
                        <div class="inch-split">
                            <input type="number" id="m-v3-whole-${id}" value="${defV3}" min="0">
                            <select id="m-v3-frac-${id}" class="frac-select"></select>
                        </div>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
            populateFractions();
            toggleMultiItemInputs(id);
        }

        function toggleMultiItemInputs(id) {
            const type = document.getElementById(`m-type-${id}`).value;
            const lblV1 = document.getElementById(`m-lbl-v1-${id}`);
            const lblV2 = document.getElementById(`m-lbl-v2-${id}`);
            
            document.getElementById(`m-group-v2-${id}`).style.display = 'block';
            document.getElementById(`m-group-v3-${id}`).style.display = (type === 'saddle4') ? 'block' : 'none';
            document.getElementById(`m-angle-wrap-${id}`).style.display = (type === 'stub') ? 'none' : 'block';

            if (type === 'stub') {
                document.getElementById(`m-group-v2-${id}`).style.display = 'none';
                lblV1.innerText = "Высота стюба от конца трубы";
            } else if (type === 'kick') {
                lblV1.innerText = "Расстояние от конца трубы до центра кика";
                lblV2.innerText = "Высота кика";
            } else if (type === 'offset') {
                lblV1.innerText = "Центр препятствия / старт";
                lblV2.innerText = "Глубина оффсета";
            } else if (type === 'saddle3' || type === 'saddle4') {
                lblV1.innerText = "Центр препятствия от стены";
                lblV2.innerText = "Высота препятствия";
            }
        }

        function calculateMultiRun() {
            const sizeSel = document.getElementById('m-conduit-size');
            const opt = sizeSel.options[sizeSel.selectedIndex];
            const takeup = parseFloat(opt?.getAttribute('data-takeup')) || 6;
            const clr = parseFloat(opt?.getAttribute('data-clr')) || 4.375;

            const items = document.querySelectorAll('.bend-item');
            const errBox = document.getElementById('m-error-container');
            errBox.innerHTML = '';
            items.forEach(el => el.classList.remove('error'));

            if (items.length === 0) {
                errBox.innerHTML = `<div class="error-banner">⚠️ Добавь хотя бы один гиб в список.</div>`;
                return;
            }

            let bends = [];
            let hasError = false;

            for (let item of items) {
                const id = item.getAttribute('data-id');
                const type = document.getElementById(`m-type-${id}`).value;
                const v1 = getSplitVal(`m-v1-whole-${id}`, `m-v1-frac-${id}`);
                const v2 = getSplitVal(`m-v2-whole-${id}`, `m-v2-frac-${id}`);
                const v3 = getSplitVal(`m-v3-whole-${id}`, `m-v3-frac-${id}`);
                const angle = parseFloat(document.getElementById(`m-angle-${id}`)?.value || 30);
                const rad = angle * (Math.PI / 180);
                const mult = 1 / Math.sin(rad);
                const shrink = v2 * ((1 - Math.cos(rad)) / Math.sin(rad));
                const centerCorr = clr * Math.tan(rad / 2);

                let minM = 0, maxM = 0, details = {};
                
                if (type === 'stub') {
                    minM = v1 - takeup; maxM = v1;
                    details = { title: '90° Стюб', desc: `Метка: ${formatInches(minM)}` };
                } else if (type === 'kick') {
                    const m1 = v1 - shrink - centerCorr;
                    const m2 = m1 + (v2 * mult);
                    minM = m1; maxM = m2;
                    details = { title: `Кик (${angle}°)`, desc: `М1=${formatInches(m1)}, М2=${formatInches(m2)}` };
                } else if (type === 'offset') {
                    const m1 = v1 + shrink - centerCorr;
                    const m2 = m1 + (v2 * mult);
                    minM = m1; maxM = m2;
                    details = { title: `Оффсет (${angle}°)`, desc: `М1=${formatInches(m1)}, М2=${formatInches(m2)}` };
                } else if (type === 'saddle3') {
                    const dist = v2 * mult;
                    const sShrink = 2 * shrink;
                    const m2 = v1 + sShrink;
                    const m1 = m2 - dist - centerCorr;
                    const m3 = m2 + dist + centerCorr;
                    minM = m1; maxM = m3;
                    details = { title: `Седло 3 точки`, desc: `М1=${formatInches(m1)}, Центр=${formatInches(m2)}, М3=${formatInches(m3)}` };
                } else if (type === 'saddle4') {
                    const totalShrink = 2 * shrink;
                    const adjCenter = v1 + totalShrink;
                    const dist = v2 * mult;
                    const m2 = adjCenter - (v3/2);
                    const m3 = adjCenter + (v3/2);
                    const m1 = m2 - dist - centerCorr;
                    const m4 = m3 + dist + centerCorr;
                    minM = m1; maxM = m4;
                    details = { title: `Седло 4 точки`, desc: `М1=${formatInches(m1)}, М2=${formatInches(m2)}, М3=${formatInches(m3)}, М4=${formatInches(m4)}` };
                }
                bends.push({ id, minM, maxM, details });
            }

            for (let i = 0; i < bends.length - 1; i++) {
                if (bends[i+1].minM < bends[i].maxM + 1.0) {
                    hasError = true;
                    document.getElementById(`m-item-${bends[i].id}`).classList.add('error');
                    document.getElementById(`m-item-${bends[i+1].id}`).classList.add('error');
                    errBox.innerHTML += `<div class="error-banner">❌ Ошибка: Гиб #${bends[i].id} накладывается на гиб #${bends[i+1].id}! Увеличь расстояние между ними.</div>`;
                }
            }

            if (hasError) {
                document.getElementById('m-results').style.display = 'none';
                document.getElementById('m-instructions').style.display = 'none';
                return;
            }

            let resHtml = `<h3>📐 Таблица меток на трубе:</h3>`;
            let instrHtml = `<h4>👶 Пошаговая инструкция для чайников (делай строго по порядку):</h4><ol>`;
            bends.forEach((b, idx) => {
                resHtml += `<div class="result-block"><b>Гиб #${idx+1}: ${b.details.title}</b><br>Метки: <b>${b.details.desc}</b></div>`;
                instrHtml += `<li><b>Шаг ${idx+1} (${b.details.title}):</b> Нанеси метки <b>${b.details.desc}</b> и сделай этот элемент по порядку от начала трубы. Не обрезай трубу раньше времени!</li>`;
            });
            instrHtml += `</ol>`;

            document.getElementById('m-results').style.display = 'block';
            document.getElementById('m-results').innerHTML = resHtml;
            document.getElementById('m-instructions').style.display = 'block';
            document.getElementById('m-instructions').innerHTML = instrHtml;
        }

        let parallelCounter = 0;
        function toggleParallelSpacing() {
            const mode = document.getElementById('p-spacing-mode').value;
            document.getElementById('p-uniform-gap-group').style.display = (mode === 'uniform') ? 'block' : 'none';
        }
        function toggleParallelFittingInputs() {
            const type = document.getElementById('p-fitting-type').value;
            document.getElementById('p-group-v2').style.display = (type === 'stub') ? 'none' : 'block';
            document.getElementById('p-group-angle').style.display = (type === 'stub') ? 'none' : 'block';
        }

        function addParallelPipe() {
            parallelCounter++;
            const id = parallelCounter;
            const container = document.getElementById('p-pipes-container');
            const t = i18n[currentLang];

            const html = `
                <div class="pipe-item" id="p-item-${id}">
                    <div class="item-header">
                        <span>${t.pipeLabel} #${id}</span>
                        <button class="remove-btn" onclick="document.getElementById('p-item-${id}').remove()">${t.pDel}</button>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Тип</label>
                            <select id="p-type-${id}">
                                <option value="emt">EMT</option>
                                <option value="imc">IMC</option>
                                <option value="rigid">Rigid</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Размер</label>
                            <select id="p-size-${id}">
                                <option value="1/2">1/2"</option>
                                <option value="3/4" selected>3/4"</option>
                                <option value="1">1"</option>
                            </select>
                        </div>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
        }

        function calculateParallelRun() {
            const fitType = document.getElementById('p-fitting-type').value;
            const uniformGap = getSplitVal('p-gap-whole', 'p-gap-frac');
            const baseV1 = getSplitVal('p-v1-whole', 'p-v1-frac');
            const baseV2 = getSplitVal('p-v2-whole', 'p-v2-frac');
            const angle = fitType === 'stub' ? 90 : parseFloat(document.getElementById('p-base-angle').value);

            const items = document.querySelectorAll('.pipe-item');
            let pipes = [];
            items.forEach((item, idx) => {
                pipes.push({ id: idx + 1, takeup: 6 });
            });

            let resultsHTML = `<h3>📐 Спецификация пакета параллельных труб:</h3>`;
            const rad = angle * (Math.PI / 180);
            let cumShift = 0;

            pipes.forEach((p, idx) => {
                if (idx > 0) cumShift += uniformGap;
                let desc = "";
                if (fitType === 'stub') {
                    let mark = baseV1 + cumShift - p.takeup;
                    desc = `Метка для 90°: <b>${formatInches(mark)}</b>`;
                } else {
                    let shrink = baseV2 * ((1 - Math.cos(rad)) / Math.sin(rad));
                    let mark = baseV1 + cumShift + shrink;
                    desc = `Метка для гиба: <b>${formatInches(mark)}</b> (Усадка: ${shrink.toFixed(2)}")`;
                }
                resultsHTML += `<div class="pipe-result-card"><b>Труба #${p.id}:</b> ${desc}</div>`;
            });

            const res = document.getElementById('p-results');
            res.style.display = 'block';
            res.innerHTML = resultsHTML;
        }

        populateFractions();
        updateSizeOptions('s');
        toggleSingleInputs();
        addMultiItem('kick', 12, 2);
        addMultiItem('offset', 36, 4);
        addParallelPipe();
        addParallelPipe();
        changeLanguage('ru');
    </script>
</body>
</html>
