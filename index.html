<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conduit Bending Calculator Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-amber-500 selection:text-slate-950">

    <!-- Top Header Bar -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 px-4 py-3 shadow-lg">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-amber-500 text-slate-950 p-2 rounded-xl font-black text-xl tracking-wider shadow-md shadow-amber-500/20">
                    ⚡ CB<span class="text-slate-900 font-bold text-xs uppercase">Pro</span>
                </div>
                <div>
                    <h1 id="app-title" class="font-bold text-lg text-slate-100 tracking-tight">Калькулятор Гибки Труб Pro</h1>
                    <p id="app-subtitle" class="text-xs text-slate-400">Точный расчет шринков, оффсетов, киков и седел</p>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <div class="bg-slate-800 p-1 rounded-xl flex items-center border border-slate-700/60">
                    <button onclick="setLang('ru')" id="lang-btn-ru" class="px-3 py-1 text-xs font-bold rounded-lg transition-all bg-amber-500 text-slate-950 shadow">RU</button>
                    <button onclick="setLang('en')" id="lang-btn-en" class="px-3 py-1 text-xs font-bold rounded-lg transition-all text-slate-400 hover:text-slate-200">EN</button>
                </div>
                <button onclick="copyPlanToClipboard()" class="bg-slate-800 hover:bg-slate-700 text-amber-400 border border-amber-500/30 px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 transition-all active:scale-95 shadow-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
                    <span id="btn-copy-text">Копировать план</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Navigation Tabs (4 tabs: Stub, Offset, Kick, 3-Point, 4-Point) -->
    <nav class="bg-slate-900/60 border-b border-slate-800 backdrop-blur-md sticky top-[61px] z-40 overflow-x-auto">
        <div class="max-w-7xl mx-auto px-4 flex gap-2 py-2 no-scrollbar">
            <button onclick="switchTab('stub')" id="tab-btn-stub" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition-all whitespace-nowrap bg-amber-500 text-slate-950 shadow-md">90° Стуб</button>
            <button onclick="switchTab('offset')" id="tab-btn-offset" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition-all whitespace-nowrap bg-slate-800 text-slate-400 hover:text-slate-200">Оффсет</button>
            <button onclick="switchTab('kick')" id="tab-btn-kick" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition-all whitespace-nowrap bg-slate-800 text-slate-400 hover:text-slate-200">Кик (Kick)</button>
            <button onclick="switchTab('saddle3')" id="tab-btn-saddle3" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition-all whitespace-nowrap bg-slate-800 text-slate-400 hover:text-slate-200">3-Точ. Седло</button>
            <button onclick="switchTab('saddle4')" id="tab-btn-saddle4" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition-all whitespace-nowrap bg-slate-800 text-slate-400 hover:text-slate-200">4-Точ. Седло</button>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Controls Column -->
        <section class="lg:col-span-5 space-y-6">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg">
                <label id="label-conduit-size" class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Размер трубы (Conduit Size)</label>
                <div class="grid grid-cols-4 gap-2">
                    <button onclick="setConduitSize('1/2')" id="size-1/2" class="conduit-size-btn py-2.5 rounded-xl font-bold text-xs border border-slate-700 bg-amber-500 text-slate-950 transition-all">1/2" EMT</button>
                    <button onclick="setConduitSize('3/4')" id="size-3/4" class="conduit-size-btn py-2.5 rounded-xl font-bold text-xs border border-slate-700 bg-slate-800 text-slate-300 transition-all">3/4" EMT</button>
                    <button onclick="setConduitSize('1')" id="size-1" class="conduit-size-btn py-2.5 rounded-xl font-bold text-xs border border-slate-700 bg-slate-800 text-slate-300 transition-all">1" EMT</button>
                    <button onclick="setConduitSize('1-1/4')" id="size-1-1/4" class="conduit-size-btn py-2.5 rounded-xl font-bold text-xs border border-slate-700 bg-slate-800 text-slate-300 transition-all">1-1/4"</button>
                </div>
            </div>

            <div id="calculator-inputs" class="space-y-6"></div>
        </section>

        <!-- Results & Visualizations Column -->
        <section class="lg:col-span-7 space-y-6">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl relative overflow-hidden">
                <div class="absolute top-0 right-0 w-32 h-32 bg-amber-500/5 rounded-full blur-2xl pointer-events-none"></div>
                <h2 id="results-heading" class="text-xs font-bold text-amber-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    Результаты расчета и разметка
                </h2>
                
                <div id="results-grid" class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6"></div>

                <div class="bg-slate-950/70 border border-slate-800/80 rounded-xl p-4">
                    <h3 id="instructions-title" class="text-xs font-bold text-slate-300 uppercase tracking-wider mb-3 flex items-center gap-2">
                        <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        Пошаговые инструкции гибки
                    </h3>
                    <div id="step-by-step-instructions" class="space-y-3 text-xs text-slate-300"></div>
                </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                <div class="flex items-center justify-between mb-4">
                    <h3 id="diagram-heading" class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2">
                        <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                        Визуальная схема / Спецификация
                    </h3>
                    <span id="diagram-badge" class="text-[10px] bg-slate-800 text-amber-400 border border-amber-500/20 px-2 py-0.5 rounded-md font-mono">Live Render</span>
                </div>
                <div id="svg-container" class="w-full bg-slate-950/80 rounded-xl border border-slate-800/80 flex items-center justify-center p-4 overflow-hidden min-h-[260px]"></div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        <p>Conduit Bending Calculator Pro • Professional Electrician Suite</p>
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        let currentLang = 'ru';
        let currentTab = 'stub';
        let conduitSize = '1/2';

        const benderSpecs = {
            '1/2': { takeUp: 5, gain: 0.25 },
            '3/4': { takeUp: 6, gain: 0.50 },
            '1':   { takeUp: 8, gain: 0.75 },
            '1-1/4': { takeUp: 11, gain: 1.25 }
        };

        const offsetShrinkTable = { 10: 0.0625, 22.5: 0.1875, 30: 0.25, 45: 0.375, 60: 0.50 };
        const offsetMultiplierTable = { 10: 5.6713, 22.5: 2.4142, 30: 1.7320, 45: 1.0000, 60: 1.1547 };
        const saddleMultiplierTable = { 10: 5.7588, 22.5: 2.6131, 30: 2.0000, 45: 1.4142, 60: 1.1547 };
        const saddleShrinkTable = { 10: 0.125, 22.5: 0.375, 30: 0.50, 45: 0.75, 60: 1.00 };

        const i18n = {
            ru: {
                title: "Калькулятор Гибки Труб Pro",
                subtitle: "Точный расчет шринков, оффсетов, киков и седел",
                copyPlan: "Копировать план",
                conduitSize: "Размер трубы (Conduit Size)",
                resultsHeading: "Результаты расчета и разметка",
                instructionsTitle: "Пошаговые инструкции гибки",
                diagramHeading: "Визуальная схема / Спецификация",
                tabs: {
                    stub: "90° Стуб",
                    offset: "Оффсет",
                    kick: "Кик (Kick)",
                    saddle3: "3-Точ. Седло",
                    saddle4: "4-Точ. Седло"
                },
                labels: {
                    stubHeight: "Высота стуба (Stub Height)",
                    offsetRise: "Высота подъема (Rise)",
                    kickRise: "Высота кика (Kick Rise)",
                    angle: "Угол гиба (Angle)",
                    mode: "Режим отсчета",
                    modeA: "A: От конца трубы",
                    modeB: "B: От препятствия",
                    obstacleDist: "Центр препятствия (Obstacle Center)",
                    saddleDepth: "Глубина седла (Depth)",
                    obstWidth: "Ширина препятствия (Width)"
                }
            },
            en: {
                title: "Conduit Bending Calculator Pro",
                subtitle: "Precise calculation for shrink, offsets, kicks & saddles",
                copyPlan: "Copy Plan",
                conduitSize: "Conduit Size",
                resultsHeading: "Calculation Results & Marks",
                instructionsTitle: "Step-by-Step Bending Instructions",
                diagramHeading: "Visual Diagram / Specs",
                tabs: {
                    stub: "90° Stub",
                    offset: "Offset",
                    kick: "Kick",
                    saddle3: "3-Point Saddle",
                    saddle4: "4-Point Saddle"
                },
                labels: {
                    stubHeight: "Stub Height",
                    offsetRise: "Offset Rise",
                    kickRise: "Kick Rise",
                    angle: "Bend Angle",
                    mode: "Reference Mode",
                    modeA: "A: From End",
                    modeB: "From Obstacle",
                    obstacleDist: "Obstacle Center",
                    saddleDepth: "Obstacle Depth",
                    obstWidth: "Obstacle Width"
                }
            }
        };

        function formatInches(decimalInches) {
            if (isNaN(decimalInches) || decimalInches < 0) return '0"';
            let whole = Math.floor(decimalInches);
            let remainder = decimalInches - whole;
            let sixteenths = Math.round(remainder * 16);
            if (sixteenths === 16) { whole += 1; sixteenths = 0; }
            if (sixteenths === 0) return `${whole}"`;
            let num = sixteenths, den = 16;
            while (num % 2 === 0 && den % 2 === 0) { num /= 2; den /= 2; }
            return whole === 0 ? `${num}/${den}"` : `${whole} ${num}/${den}"`;
        }

        function renderImperialInput(idPrefix, labelText, defaultWhole = 12, defaultFrac = 0) {
            let optionsHTML = '';
            const fracTexts = ['0', '1/16', '1/8', '3/16', '1/4', '5/16', '3/8', '7/16', '1/2', '9/16', '5/8', '11/16', '3/4', '13/16', '7/8', '15/16'];
            for (let i = 0; i < 16; i++) {
                optionsHTML += `<option value="${i/16}" ${i === defaultFrac ? 'selected' : ''}>${fracTexts[i]}</option>`;
            }
            return `
                <div class="space-y-1.5">
                    <label class="block text-xs font-semibold text-slate-300">${labelText}</label>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <span class="text-[10px] text-slate-400 block mb-0.5">${currentLang === 'ru' ? 'Целые' : 'Whole'}</span>
                            <input type="number" id="${idPrefix}-whole" value="${defaultWhole}" min="0" max="300" oninput="calculate()" 
                                class="w-full bg-slate-950 border border-slate-750 rounded-xl px-3 py-2.5 text-slate-100 mono text-sm focus:outline-none focus:border-amber-500 transition-all">
                        </div>
                        <div>
                            <span class="text-[10px] text-slate-400 block mb-0.5">${currentLang === 'ru' ? 'Дробь' : 'Fraction'}</span>
                            <select id="${idPrefix}-frac" onchange="calculate()" 
                                class="w-full bg-slate-950 border border-slate-750 rounded-xl px-2.5 py-2.5 text-slate-100 mono text-sm focus:outline-none focus:border-amber-500 transition-all">
                                ${optionsHTML}
                            </select>
                        </div>
                    </div>
                </div>
            `;
        }

        function getInputValue(idPrefix) {
            const wholeEl = document.getElementById(`${idPrefix}-whole`);
            const fracEl = document.getElementById(`${idPrefix}-frac`);
            if (!wholeEl || !fracEl) return 0;
            return parseFloat(wholeEl.value || 0) + parseFloat(fracEl.value || 0);
        }

        function setLang(lang) {
            currentLang = lang;
            document.getElementById('lang-btn-ru').className = lang === 'ru' ? 'px-3 py-1 text-xs font-bold rounded-lg transition-all bg-amber-500 text-slate-950 shadow' : 'px-3 py-1 text-xs font-bold rounded-lg transition-all text-slate-400 hover:text-slate-200';
            document.getElementById('lang-btn-en').className = lang === 'en' ? 'px-3 py-1 text-xs font-bold rounded-lg transition-all bg-amber-500 text-slate-950 shadow' : 'px-3 py-1 text-xs font-bold rounded-lg transition-all text-slate-400 hover:text-slate-200';
            
            document.getElementById('app-title').innerText = i18n[lang].title;
            document.getElementById('app-subtitle').innerText = i18n[lang].subtitle;
            document.getElementById('btn-copy-text').innerText = i18n[lang].copyPlan;
            document.getElementById('label-conduit-size').innerText = i18n[lang].conduitSize;
            document.getElementById('results-heading').innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>${i18n[lang].resultsHeading}`;
            document.getElementById('instructions-title').innerHTML = `<svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>${i18n[lang].instructionsTitle}`;
            document.getElementById('diagram-heading').innerHTML = `<svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>${i18n[lang].diagramHeading}`;

            for (let t of ['stub', 'offset', 'kick', 'saddle3', 'saddle4']) {
                document.getElementById(`tab-btn-${t}`).innerText = i18n[lang].tabs[t];
            }
            renderInputsForTab(currentTab);
        }

        function switchTab(tab) {
            currentTab = tab;
            for (let t of ['stub', 'offset', 'kick', 'saddle3', 'saddle4']) {
                const btn = document.getElementById(`tab-btn-${t}`);
                if (t === tab) {
                    btn.className = "tab-btn px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition-all whitespace-nowrap bg-amber-500 text-slate-950 shadow-md";
                } else {
                    btn.className = "tab-btn px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition-all whitespace-nowrap bg-slate-800 text-slate-400 hover:text-slate-200";
                }
            }
            renderInputsForTab(tab);
        }

        function setConduitSize(size) {
            conduitSize = size;
            for (let s of ['1/2', '3/4', '1', '1-1/4']) {
                const btn = document.getElementById(`size-${s}`);
                if (s === size) {
                    btn.className = "conduit-size-btn py-2.5 rounded-xl font-bold text-xs border border-slate-700 bg-amber-500 text-slate-950 transition-all";
                } else {
                    btn.className = "conduit-size-btn py-2.5 rounded-xl font-bold text-xs border border-slate-700 bg-slate-800 text-slate-300 transition-all";
                }
            }
            calculate();
        }

        function renderInputsForTab(tab) {
            const container = document.getElementById('calculator-inputs');
            let html = '';
            const L = i18n[currentLang].labels;
            const standardAngleOptions = `
                <option value="10">10° (Mult: 5.67 | Shrink: 1/16")</option>
                <option value="22.5">22.5° (Mult: 2.41 | Shrink: 3/16")</option>
                <option value="30" selected>30° (Mult: 1.73 | Shrink: 1/4")</option>
                <option value="45">45° (Mult: 1.00 | Shrink: 3/8")</option>
                <option value="60">60° (Mult: 1.15 | Shrink: 1/2")</option>
            `;

            if (tab === 'stub') {
                html += `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4 shadow-lg">
                        <h3 class="text-xs font-bold text-amber-400 uppercase tracking-wider">${i18n[currentLang].tabs.stub}</h3>
                        ${renderImperialInput('stub-h', L.stubHeight, 24, 0)}
                    </div>
                `;
            } else if (tab === 'offset') {
                html += `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4 shadow-lg">
                        <h3 class="text-xs font-bold text-amber-400 uppercase tracking-wider">${i18n[currentLang].tabs.offset}</h3>
                        ${renderImperialInput('off-rise', L.offsetRise, 6, 0)}
                        <div class="space-y-1.5">
                            <label class="block text-xs font-semibold text-slate-300">${L.angle}</label>
                            <select id="off-angle" onchange="calculate()" class="w-full bg-slate-950 border border-slate-750 rounded-xl px-3 py-2.5 text-slate-100 mono text-sm focus:outline-none focus:border-amber-500 transition-all">
                                ${standardAngleOptions}
                            </select>
                        </div>
                        <div class="space-y-1.5 pt-2 border-t border-slate-800">
                            <label class="block text-xs font-semibold text-amber-400">${L.mode}</label>
                            <div class="grid grid-cols-2 gap-2">
                                <button onclick="setOffsetMode('A')" id="off-mode-A" class="py-2 px-3 rounded-xl text-xs font-bold border border-amber-500 bg-amber-500 text-slate-950 transition-all">${L.modeA}</button>
                                <button onclick="setOffsetMode('B')" id="off-mode-B" class="py-2 px-3 rounded-xl text-xs font-bold border border-slate-700 bg-slate-800 text-slate-300 transition-all">${L.modeB}</button>
                            </div>
                        </div>
                        <div id="obstacle-input-container" class="space-y-4 pt-2 hidden">
                            ${renderImperialInput('off-obst', L.obstacleDist, 36, 0)}
                        </div>
                    </div>
                `;
            } else if (tab === 'kick') {
                html += `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4 shadow-lg">
                        <h3 class="text-xs font-bold text-amber-400 uppercase tracking-wider">${i18n[currentLang].tabs.kick}</h3>
                        ${renderImperialInput('kick-rise', L.kickRise, 3, 0)}
                        <div class="space-y-1.5">
                            <label class="block text-xs font-semibold text-slate-300">${L.angle}</label>
                            <select id="kick-angle" onchange="calculate()" class="w-full bg-slate-950 border border-slate-750 rounded-xl px-3 py-2.5 text-slate-100 mono text-sm focus:outline-none focus:border-amber-500 transition-all">
                                ${standardAngleOptions}
                            </select>
                        </div>
                        <div class="space-y-1.5 pt-2 border-t border-slate-800">
                            <label class="block text-xs font-semibold text-amber-400">${L.mode}</label>
                            <div class="grid grid-cols-2 gap-2">
                                <button onclick="setKickMode('A')" id="kick-mode-A" class="py-2 px-3 rounded-xl text-xs font-bold border border-amber-500 bg-amber-500 text-slate-950 transition-all">${L.modeA}</button>
                                <button onclick="setKickMode('B')" id="kick-mode-B" class="py-2 px-3 rounded-xl text-xs font-bold border border-slate-700 bg-slate-800 text-slate-300 transition-all">${L.modeB}</button>
                            </div>
                        </div>
                        <div id="kick-obstacle-container" class="space-y-4 pt-2 hidden">
                            ${renderImperialInput('kick-obst', L.obstacleDist, 36, 0)}
                        </div>
                    </div>
                `;
            } else if (tab === 'saddle3') {
                html += `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4 shadow-lg">
                        <h3 class="text-xs font-bold text-amber-400 uppercase tracking-wider">${i18n[currentLang].tabs.saddle3}</h3>
                        ${renderImperialInput('sad-depth', L.saddleDepth, 4, 0)}
                        ${renderImperialInput('sad-obst', L.obstacleDist, 24, 0)}
                        <div class="space-y-1.5">
                            <label class="block text-xs font-semibold text-slate-300">${L.angle} (Outer Bends)</label>
                            <select id="sad-angle" onchange="calculate()" class="w-full bg-slate-950 border border-slate-750 rounded-xl px-3 py-2.5 text-slate-100 mono text-sm focus:outline-none focus:border-amber-500 transition-all">
                                <option value="10">10° outer / 20° center</option>
                                <option value="22.5">22.5° outer / 45° center</option>
                                <option value="30" selected>30° outer / 60° center</option>
                                <option value="45">45° outer / 90° center</option>
                                <option value="60">60° outer / 120° center</option>
                            </select>
                        </div>
                    </div>
                `;
            } else if (tab === 'saddle4') {
                html += `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4 shadow-lg">
                        <h3 class="text-xs font-bold text-amber-400 uppercase tracking-wider">${i18n[currentLang].tabs.saddle4}</h3>
                        ${renderImperialInput('sad-depth', L.saddleDepth, 4, 0)}
                        ${renderImperialInput('sad-width', L.obstWidth, 12, 0)}
                        ${renderImperialInput('sad-obst', L.obstacleDist, 30, 0)}
                        <div class="space-y-1.5">
                            <label class="block text-xs font-semibold text-slate-300">${L.angle} (Bend Angle)</label>
                            <select id="sad-angle" onchange="calculate()" class="w-full bg-slate-950 border border-slate-750 rounded-xl px-3 py-2.5 text-slate-100 mono text-sm focus:outline-none focus:border-amber-500 transition-all">
                                ${standardAngleOptions}
                            </select>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
            calculate();
        }

        let offsetMode = 'A';
        function setOffsetMode(mode) {
            offsetMode = mode;
            const btnA = document.getElementById('off-mode-A');
            const btnB = document.getElementById('off-mode-B');
            const obstCont = document.getElementById('obstacle-input-container');
            if (mode === 'A') {
                btnA.className = "py-2 px-3 rounded-xl text-xs font-bold border border-amber-500 bg-amber-500 text-slate-950 transition-all";
                btnB.className = "py-2 px-3 rounded-xl text-xs font-bold border border-slate-700 bg-slate-800 text-slate-300 transition-all";
                obstCont.classList.add('hidden');
            } else {
                btnB.className = "py-2 px-3 rounded-xl text-xs font-bold border border-amber-500 bg-amber-500 text-slate-950 transition-all";
                btnA.className = "py-2 px-3 rounded-xl text-xs font-bold border border-slate-700 bg-slate-800 text-slate-300 transition-all";
                obstCont.classList.remove('hidden');
            }
            calculate();
        }

        let kickMode = 'A';
        function setKickMode(mode) {
            kickMode = mode;
            const btnA = document.getElementById('kick-mode-A');
            const btnB = document.getElementById('kick-mode-B');
            const obstCont = document.getElementById('kick-obstacle-container');
            if (mode === 'A') {
                btnA.className = "py-2 px-3 rounded-xl text-xs font-bold border border-amber-500 bg-amber-500 text-slate-950 transition-all";
                btnB.className = "py-2 px-3 rounded-xl text-xs font-bold border border-slate-700 bg-slate-800 text-slate-300 transition-all";
                obstCont.classList.add('hidden');
            } else {
                btnB.className = "py-2 px-3 rounded-xl text-xs font-bold border border-amber-500 bg-amber-500 text-slate-950 transition-all";
                btnA.className = "py-2 px-3 rounded-xl text-xs font-bold border border-slate-700 bg-slate-800 text-slate-300 transition-all";
                obstCont.classList.remove('hidden');
            }
            calculate();
        }

        function calculate() {
            const spec = benderSpecs[conduitSize] || benderSpecs['1/2'];
            const resultsGrid = document.getElementById('results-grid');
            const instructionsContainer = document.getElementById('step-by-step-instructions');
            const svgContainer = document.getElementById('svg-container');

            let resCardsHTML = '', instructionsHTML = '', svgHTML = '';

            if (currentTab === 'stub') {
                const stubH = getInputValue('stub-h');
                const mark1 = stubH - spec.takeUp;

                resCardsHTML = `
                    <div class="bg-slate-950/80 border border-slate-800/80 rounded-xl p-3 text-center">
                        <span class="text-[10px] text-slate-400 block uppercase mb-1">Отметка гиба</span>
                        <span class="text-xl font-extrabold text-amber-400 mono">${formatInches(mark1)}</span>
                    </div>
                    <div class="bg-slate-950/80 border border-slate-800/80 rounded-xl p-3 text-center">
                        <span class="text-[10px] text-slate-400 block uppercase mb-1">Take-up бендера</span>
                        <span class="text-xl font-bold text-slate-200 mono">${formatInches(spec.takeUp)}</span>
                    </div>
                    <div class="bg-slate-950/80 border border-slate-800/80 rounded-xl p-3 text-center">
                        <span class="text-[10px] text-slate-400 block uppercase mb-1">Высота стуба</span>
                        <span class="text-xl font-bold text-slate-200 mono">${formatInches(stubH)}</span>
                    </div>
                    <div class="bg-slate-950/80 border border-slate-800/80 rounded-xl p-3 text-center">
                        <span class="text-[10px] text-slate-400 block uppercase mb-1">Угол</span>
                        <span class="text-xl font-bold text-slate-200 mono">90°</span>
                    </div>
                `;
                instructionsHTML = `
                    <div class="flex items-start gap-2.5"><span class="bg-amber-500 text-slate-950 font-bold text-[10px] w-5 h-5 rounded-full flex items-center justify-center shrink-0 mt-0.5">1</span><p>Отмерьте от торца трубы требуемую высоту стуба минус Take-up бендера (<b>${formatInches(spec.takeUp)}</b>). Поставьте метку на расстоянии <b>${formatInches(mark1)}</b>.</p></div>
                    <div class="flex items-start gap-2.5"><span class="bg-amber-500 text-slate-950 font-bold text-[10px] w-5 h-5 rounded-full flex items-center justify-center shrink-0 mt-0.5">2</span><p>Заложите трубу в бендер так, чтобы метка точно совпала со <b>стрелкой (Arrow)</b> на башмаке инструмента. Убедитесь в соосности трубы.</p></div>
                    <div class="flex items-start gap-2.5"><span class="bg-amber-500 text-slate-950 font-bold text-[10px] w-5 h-5 rounded-full flex items-center justify-center shrink-0 mt-0.5">3</span><p>Надавите ногой на упор бендера и согните трубу строго до вертикальных <b>90°</b> (проверяйте угольником).</p></div>
                `;
                svgHTML = `<svg viewBox="0 0 400 180" class="w-full h-48"><path d="M 50 140 L 250 140 A 40 40 0 0 0 290 100 L 290 40" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/><circle cx="210" cy="140" r="4" fill="#38bdf8"/><text x="200" y="165" fill="#38bdf8" font-size="11" class="mono">Mark: ${formatInches(mark1)}</text></svg>`;

            } else if (currentTab === 'offset') {
                const rise = getInputValue('off-rise');
                const angle = parseFloat(document.getElementById('off-angle').value);
                const shrinkFactor = offsetShrinkTable[angle] || 0.25;
                const mult = offsetMultiplierTable[angle] || 1.732;

                const distBetweenBends = rise * mult;
                const totalShrink = rise * shrinkFactor;

                let mark1, mark2;
                if (offsetMode === 'A') {
                    mark1 = 6.0;
                    mark2 = mark1 + distBetweenBends;
                } else {
                    const obstCenter = getInputValue('off-obst');
                    let halfDist = distBetweenBends / 2;
                    mark1 = obstCenter - halfDist + totalShrink;
                    mark2 = mark1 + distBetweenBends;
                }

                resCardsHTML = `
                    <div class="bg-slate-950/80 border border-slate-800/80 rounded-xl p-3 text-center">
                        <span class="text-[10px] text-slate-400 block uppercase mb-1">Метка 1 (Mark 1)</span>
                        <span class="text-xl font-extrabold text-amber-400 mono">${formatInches(mark1)}</span>
                    </div>
                    <div class="bg-slate-950/80 border border-slate-800/80 rounded-xl p-3 text-center">
                        <span class="text-[10px] text-slate-400 block uppercase mb-1">Метка 2 (Mark 2)</span>
                        <span class="text-xl font-extrabold text-amber-400 mono">${formatInches(mark2)}</span>
                    </div>
                    <div class="bg-slate-950/80 border border-slate-800/80 rounded-xl p-3 text-center">
                        <span class="text-[10px] text-slate-400 block uppercase mb-1">Множитель / Шринк</span>
                        <span class="text-sm font-bold text-slate-200 mono">×${mult.toFixed(2)} | ${formatInches(totalShrink)}</span>
                    </div>
                    <div class="bg-slate-950/80 border border-slate-800/80 rounded-xl p-3 text-center">
                        <span class="text-[10px] text-slate-400 block uppercase mb-1">Дистанция гибов</span>
                        <span class="text-xl font-bold text-slate-200 mono">${formatInches(distBetweenBends)}</span>
                    </div>
                `;
                instructionsHTML = `
                    <div class="flex items-start gap-2.5"><span class="bg-amber-500 text-slate-950 font-bold text-[10px] w-5 h-5 rounded-full flex items-center justify-center shrink-0 mt-0.5">1</span><p>Нанесите две отметки на трубе: <b>Метка 1 на ${formatInches(mark1)}</b> и <b>Метка 2 на ${formatInches(mark2)}</b> (дистанция между гибами равна <b>${formatInches(distBetweenBends)}</b>).</p></div>
                    <div class="flex items-start gap-2.5"><span class="bg-amber-500 text-slate-950 font-bold text-[10px] w-5 h-5 rounded-full flex items-center justify-center shrink-0 mt-0.5">2</span><p><b>Первый гиб:</b> вставьте трубу в бендер хвостовиком вперёд, совместите Метку 1 со <b>стрелкой (Arrow)</b> и согните на выбранный угол <b>${angle}°</b>.</p></div>
                    <div class="flex items-start gap-2.5"><span class="bg-amber-500 text-slate-950 font-bold text-[10px] w-5 h-5 rounded-full flex items-center justify-center shrink-0 mt-0.5">3</span><p><b>Второй гиб:</b> разверните трубу на <b>180°</b> (вдоль продольной оси), совместите Метку 2 с той же <b>стрелкой</b> и догните до <b>${angle}°</b>, следя за плоскостью гибки.</p></div>
                `;
                svgHTML = `<svg viewBox="0 0 400 180" class="w-full h-48"><path d="M 30 140 L 120 140 L 180 80 L 370 80" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/><circle cx="120" cy="140" r="4" fill="#38bdf8"/><circle cx="180" cy="80" r="4" fill="#38bdf8"/><text x="100" y="165" fill="#38bdf8" font-size="10" class="mono">M1: ${formatInches(mark1)}</text><text x="170" y="65" fill="#38bdf8" font-size="10" class="mono">M2: ${formatInches(mark2)}</text></svg>`;

            } else if (currentTab === 'kick') {
                const kickRise = getInputValue('kick-rise');
                const angle = parseFloat(document.getElementById('kick-angle').value);
                const shrinkFactor = offsetShrinkTable[angle] || 0.25;
                const mult = offsetMultiplierTable[angle] || 1.732;
                
                const shrink = kickRise * shrinkFactor;
                let bendMark;
                if (kickMode === 'A') {
                    bendMark = 24.0 + shrink; // Условная базовая отметка от конца для режима А
                } else {
                    const obstCenter = getInputValue('kick-obst');
                    bendMark = obstCenter + shrink;
                }

                resCardsHTML = `
                    <div class="bg-slate-950/80 border border-slate-800/80 rounded-xl p-3 text-center">
                        <span class="text-[10px] text-slate-400 block uppercase mb-1">Метка гиба (Kick Mark)</span>
                        <span class="text-xl font-extrabold text-amber-400 mono">${formatInches(bendMark)}</span>
                    </div>
                    <div class="bg-slate-950/80 border border-slate-800/80 rounded-xl p-3 text-center">
                        <span class="text-[10px] text-slate-400 block uppercase mb-1">Шринк (Shrink)</span>
                        <span class="text-sm font-bold text-slate-200 mono">${formatInches(shrink)}</span>
                    </div>
                    <div class="bg-slate-950/80 border border-slate-800/80 rounded-xl p-3 text-center">
                        <span class="text-[10px] text-slate-400 block uppercase mb-1">Высота (Rise)</span>
                        <span class="text-xl font-bold text-slate-200 mono">${formatInches(kickRise)}</span>
                    </div>
                    <div class="bg-slate-950/80 border border-slate-800/80 rounded-xl p-3 text-center">
                        <span class="text-[10px] text-slate-400 block uppercase mb-1">Угол</span>
                        <span class="text-xl font-bold text-slate-200 mono">${angle}°</span>
                    </div>
                `;
                instructionsHTML = `
                    <div class="flex items-start gap-2.5"><span class="bg-amber-500 text-slate-950 font-bold text-[10px] w-5 h-5 rounded-full flex items-center justify-center shrink-0 mt-0.5">1</span><p>С учетом требуемой высоты подьема кика расчетный шринк составляет <b>${formatInches(shrink)}</b>.</p></div>
                    <div class="flex items-start gap-2.5"><span class="bg-amber-500 text-slate-950 font-bold text-[10px] w-5 h-5 rounded-full flex items-center justify-center shrink-0 mt-0.5">2</span><p>Поставьте отметку на расстоянии <b>${formatInches(bendMark)}</b> (с добавлением шринка к целевой точке упора).</p></div>
                    <div class="flex items-start gap-2.5"><span class="bg-amber-500 text-slate-950 font-bold text-[10px] w-5 h-5 rounded-full flex items-center justify-center shrink-0 mt-0.5">3</span><p>Совместите метку со <b>стрелкой бендера</b> и выполните короткий гиб на угол <b>${angle}°</b>.</p></div>
                `;
                svgHTML = `<svg viewBox="0 0 400 180" class="w-full h-48"><path d="M 50 140 L 250 140 L 320 90" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/><circle cx="250" cy="140" r="4" fill="#38bdf8"/><text x="230" y="165" fill="#38bdf8" font-size="10" class="mono">Kick Mark: ${formatInches(bendMark)}</text></svg>`;

            } else if (currentTab === 'saddle3') {
                const depth = getInputValue('sad-depth');
                const obstCenter = getInputValue('sad-obst');
                const outerAngle = parseFloat(document.getElementById('sad-angle').value);
                const centerAngle = outerAngle * 2;
                const spread = depth * (saddleMultiplierTable[outerAngle] || 2.0);
                const shrink = depth * (saddleShrinkTable[outerAngle] || 0.5);
                
                const markCenter = obstCenter + shrink;
                const markLeft = markCenter - spread;
                const markRight = markCenter + spread;

                resCardsHTML = `
                    <div class="bg-slate-950/80 border border-slate-800/80 rounded-xl p-3 text-center">
                        <span class="text-[10px] text-slate-400 block uppercase mb-1">Центр (Center Mark)</span>
                        <span class="text-xl font-extrabold text-amber-400 mono">${formatInches(markCenter)}</span>
                    </div>
                    <div class="bg-slate-950/80 border border-slate-800/80 rounded-xl p-3 text-center">
                        <span class="text-[10px] text-slate-400 block uppercase mb-1">Боковые метки</span>
                        <span class="text-sm font-extrabold text-slate-200 mono">${formatInches(markLeft)} / ${formatInches(markRight)}</span>
                    </div>
                    <div class="bg-slate-950/80 border border-slate-800/80 rounded-xl p-3 text-center">
                        <span class="text-[10px] text-slate-400 block uppercase mb-1">Шринк седла</span>
                        <span class="text-xl font-bold text-slate-200 mono">${formatInches(shrink)}</span>
                    </div>
                    <div class="bg-slate-950/80 border border-slate-800/80 rounded-xl p-3 text-center">
                        <span class="text-[10px] text-slate-400 block uppercase mb-1">Углы (Центр/Бока)</span>
                        <span class="text-xl font-bold text-slate-200 mono">${centerAngle}° / ${outerAngle}°</span>
                    </div>
                `;
                instructionsHTML = `
                    <div class="flex items-start gap-2.5"><span class="bg-amber-500 text-slate-950 font-bold text-[10px] w-5 h-5 rounded-full flex items-center justify-center shrink-0 mt-0.5">1</span><p>Нанесите три отметки: центральную (с учетом шринка <b>${formatInches(shrink)}</b> на <b>${formatInches(markCenter)}</b>) и две боковые на <b>${formatInches(markLeft)}</b> и <b>${formatInches(markRight)}</b>.</p></div>
                    <div class="flex items-start gap-2.5"><span class="bg-amber-500 text-slate-950 font-bold text-[10px] w-5 h-5 rounded-full flex items-center justify-center shrink-0 mt-0.5">2</span><p><b>Центральный гиб:</b> совместите центральную отметку со <b>стрелкой бендера</b> и согните на <b>${centerAngle}°</b>.</p></div>
                    <div class="flex items-start gap-2.5"><span class="bg-amber-500 text-slate-950 font-bold text-[10px] w-5 h-5 rounded-full flex items-center justify-center shrink-0 mt-0.5">3</span><p><b>Боковые гибы:</b> совместите боковые отметки со <b>стрелкой</b> (развернув трубу в обратную сторону) и согните каждое плечо на <b>${outerAngle}°</b>.</p></div>
                `;
                svgHTML = `<svg viewBox="0 0 400 180" class="w-full h-48"><path d="M 30 140 L 130 140 L 200 70 L 270 140 L 370 140" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/><circle cx="200" cy="70" r="4" fill="#38bdf8"/><text x="175" y="55" fill="#38bdf8" font-size="10" class="mono">Center: ${formatInches(markCenter)}</text></svg>`;

            } else if (currentTab === 'saddle4') {
                const depth = getInputValue('sad-depth');
                const obstWidth = getInputValue('sad-width');
                const obstCenter = getInputValue('sad-obst');
                const angle = parseFloat(document.getElementById('sad-angle').value);
                const legDist = depth * (offsetMultiplierTable[angle] || 1.732);
                const shrink = 2 * depth * (offsetShrinkTable[angle] || 0.25);
                
                const halfObstTotal = (obstWidth + shrink) / 2;
                const centerM = obstCenter;
                const mark2 = centerM - halfObstTotal;
                const mark1 = mark2 - legDist;
                const mark3 = centerM + halfObstTotal;
                const mark4 = mark3 + legDist;

                resCardsHTML = `
                    <div class="bg-slate-950/80 border border-slate-800/80 rounded-xl p-3 text-center">
                        <span class="text-[10px] text-slate-400 block uppercase mb-1">Метки 1 / 4</span>
                        <span class="text-sm font-extrabold text-amber-400 mono">${formatInches(mark1)} / ${formatInches(mark4)}</span>
                    </div>
                    <div class="bg-slate-950/80 border border-slate-800/80 rounded-xl p-3 text-center">
                        <span class="text-[10px] text-slate-400 block uppercase mb-1">Метки 2 / 3</span>
                        <span class="text-sm font-extrabold text-slate-200 mono">${formatInches(mark2)} / ${formatInches(mark3)}</span>
                    </div>
                    <div class="bg-slate-950/80 border border-slate-800/80 rounded-xl p-3 text-center">
                        <span class="text-[10px] text-slate-400 block uppercase mb-1">Шринк седла</span>
                        <span class="text-xl font-bold text-slate-200 mono">${formatInches(shrink)}</span>
                    </div>
                    <div class="bg-slate-950/80 border border-slate-800/80 rounded-xl p-3 text-center">
                        <span class="text-[10px] text-slate-400 block uppercase mb-1">Угол гибов</span>
                        <span class="text-xl font-bold text-slate-200 mono">${angle}°</span>
                    </div>
                `;
                instructionsHTML = `
                    <div class="flex items-start gap-2.5"><span class="bg-amber-500 text-slate-950 font-bold text-[10px] w-5 h-5 rounded-full flex items-center justify-center shrink-0 mt-0.5">1</span><p>Отмерьте и поставьте 4 отметки симметрично центра препятствия на позициях: <b>${formatInches(mark1)}</b>, <b>${formatInches(mark2)}</b>, <b>${formatInches(mark3)}</b> и <b>${formatInches(mark4)}</b>.</p></div>
                    <div class="flex items-start gap-2.5"><span class="bg-amber-500 text-slate-950 font-bold text-[10px] w-5 h-5 rounded-full flex items-center justify-center shrink-0 mt-0.5">2</span><p>Последовательно выполните четыре оффсетных гиба на угол <b>${angle}°</b>, направляя гибы в нужную сторону для обхода плоской ширины препятствия.</p></div>
                `;
                svgHTML = `<svg viewBox="0 0 400 180" class="w-full h-48"><path d="M 20 140 L 90 140 L 140 80 L 260 80 L 310 140 L 380 140" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/><text x="160" y="70" fill="#38bdf8" font-size="10" class="mono">Width + Shrink: ${formatInches(obstWidth)}</text></svg>`;
            }

            resultsGrid.innerHTML = resCardsHTML;
            instructionsContainer.innerHTML = instructionsHTML;
            svgContainer.innerHTML = svgHTML;
        }

        function copyPlanToClipboard() {
            const textToCopy = `Conduit Plan (${conduitSize}" EMT):\n` +
                Array.from(document.querySelectorAll('#results-grid > div')).map(el => {
                    const label = el.querySelector('span:nth-child(1)').innerText;
                    const val = el.querySelector('span:nth-child(2)').innerText;
                    return `${label}: ${val}`;
                }).join('\n');
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert(currentLang === 'ru' ? 'План скопирован в буфер обмена!' : 'Plan copied to clipboard!');
            });
        }

        window.onload = function() { setLang('ru'); };
    </script>
</body>
</html>
