<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eto Bender Suka — Полевой калькулятор</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 16px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            color: #ff9800;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #b0b0b0;
        }
        select, input {
            width: 100%;
            padding: 10px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #ff9800;
            color: #121212;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #f57c00;
        }
        .result-card {
            margin-top: 20px;
            background: #252525;
            border-left: 4px solid #ff9800;
            padding: 15px;
            border-radius: 4px;
        }
        .mark-item {
            font-size: 18px;
            margin: 8px 0;
            color: #4caf50;
        }
        .steps-list {
            margin: 10px 0 0 0;
            padding-left: 20px;
            font-size: 14px;
            line-height: 1.5;
            color: #d0d0d0;
        }
        .steps-list li {
            margin-bottom: 6px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Eto Bender Suka</h2>
    
    <div class="form-group">
        <label for="conduitType">Тип трубы:</label>
        <select id="conduitType">
            <option value="emt">EMT</option>
            <option value="imc">IMC</option>
            <option value="rigid">Rigid</option>
        </select>
    </div>

    <div class="form-group">
        <label for="conduitSize">Размер:</label>
        <select id="conduitSize">
            <option value="1/2">1/2"</option>
            <option value="3/4" selected>3/4"</option>
            <option value="1">1"</option>
            <option value="1-1/4">1-1/4"</option>
            <option value="1-1/2">1-1/2"</option>
            <option value="2">2"</option>
        </select>
    </div>

    <div class="form-group">
        <label for="calcType">Тип гиба:</label>
        <select id="calcType" onchange="toggleInputs()">
            <option value="offset">Offset (Смещение)</option>
            <option value="stub">Stub-up (Подъем)</option>
            <option value="kick">Kick (Кик)</option>
            <option value="parallel">Parallel Runs (Параллельные трубы)</option>
            <option value="saddle3">3-Point Saddle (3-точечный сэдл)</option>
            <option value="saddle4">4-Point Saddle (4-точечный сэдл)</option>
        </select>
    </div>

    <div class="form-group" id="groupV1">
        <label for="v1">Базовая отметка / Высота (в дюймах):</label>
        <input type="number" id="v1" step="0.125" value="12">
    </div>

    <div class="form-group" id="groupV2">
        <label for="v2" id="labelV2">Глубина смещения (в дюймах):</label>
        <input type="number" id="v2" step="0.125" value="4">
    </div>

    <div class="form-group hidden" id="groupWidth">
        <label for="obstacleWidth">Ширина препятствия (в дюймах):</label>
        <input type="number" id="obstacleWidth" step="0.125" value="6">
    </div>

    <div class="form-group hidden" id="groupParallel">
        <label for="pipeIndex">Номер трубы в ряду (0 — первая):</label>
        <input type="number" id="pipeIndex" value="1" min="0" step="1">
        
        <label for="pipeSpacing" style="margin-top: 8px;">Шаг между осями (Spacing):</label>
        <input type="number" id="pipeSpacing" value="2" step="0.125">
    </div>

    <div class="form-group" id="groupAngle">
        <label for="angle">Угол гиба:</label>
        <select id="angle">
            <option value="10">10°</option>
            <option value="15">15°</option>
            <option value="22.5">22.5°</option>
            <option value="30" selected>30°</option>
            <option value="45">45°</option>
            <option value="60">60°</option>
        </select>
    </div>

    <button onclick="calculate()">Рассчитать</button>

    <div id="resultContainer" class="result-card hidden">
        <h3 style="margin-top:0; color:#fff;">📍 Где ставить метки:</h3>
        <div id="marksOutput"></div>
        <h3 style="margin-bottom:5px; color:#fff;">🛠 Порядок работы:</h3>
        <ol id="stepsOutput" class="steps-list"></ol>
    </div>
</div>

<script src="db.js"></script>
<script src="formulas.js"></script>

<script>
    function toggleInputs() {
        const type = document.getElementById('calcType').value;
        const groupV2 = document.getElementById('groupV2');
        const labelV2 = document.getElementById('labelV2');
        const groupAngle = document.getElementById('groupAngle');
        const groupWidth = document.getElementById('groupWidth');
        const groupParallel = document.getElementById('groupParallel');

        groupWidth.classList.add('hidden');
        groupParallel.classList.add('hidden');
        groupV2.classList.remove('hidden');
        groupAngle.classList.remove('hidden');

        if (type === 'stub') {
            groupV2.classList.add('hidden');
            groupAngle.classList.add('hidden');
        } else if (type === 'offset' || type === 'kick') {
            labelV2.innerText = "Глубина смещения (в дюймах):";
        } else if (type === 'parallel') {
            labelV2.innerText = "Глубина смещения (в дюймах):";
            groupParallel.classList.remove('hidden');
        } else if (type === 'saddle3') {
            labelV2.innerText = "Высота препятствия (в дюймах):";
        } else if (type === 'saddle4') {
            labelV2.innerText = "Высота препятствия (в дюймах):";
            groupWidth.classList.remove('hidden');
        }
    }

    function calculate() {
        const type = document.getElementById('conduitType').value;
        const size = document.getElementById('conduitSize').value;
        const calcType = document.getElementById('calcType').value;
        
        const v1 = parseFloat(document.getElementById('v1').value) || 0;
        const v2 = parseFloat(document.getElementById('v2').value) || 0;
        const width = parseFloat(document.getElementById('obstacleWidth').value) || 0;
        const angle = parseFloat(document.getElementById('angle').value) || 30;

        const spec = conduitSpecs[type][size];
        let res;

        if (calcType === 'stub') {
            res = ConduitMath.calcStub(v1, spec.takeup);
        } else if (calcType === 'offset') {
            res = ConduitMath.calcOffset(v1, v2, angle, spec.takeup, spec.clr);
        } else if (calcType === 'kick') {
            res = ConduitMath.calcKick(v1, v2, angle, spec.takeup, spec.clr);
        } else if (calcType === 'parallel') {
            const pIndex = parseInt(document.getElementById('pipeIndex').value) || 0;
            const spacing = parseFloat(document.getElementById('pipeSpacing').value) || 2;
            res = ConduitMath.calcParallelOffset(v1, v2, angle, spec.takeup, spec.clr, pIndex, spacing);
        } else if (calcType === 'saddle3') {
            res = ConduitMath.calcSaddle3(v1, v2, angle, spec.clr);
        } else if (calcType === 'saddle4') {
            res = ConduitMath.calcSaddle4(v1, v2, width, angle, spec.clr);
        }

        if (!res) return;

        let marksHTML = '';
        res.marks.forEach(m => {
            marksHTML += `<div class="mark-item"><b>${m.label}:</b> ${m.formatted} <span style="font-size:13px; color:#888;">(${m.value.toFixed(2)}")</span></div>`;
        });
        document.getElementById('marksOutput').innerHTML = marksHTML;

        let stepsHTML = '';
        res.steps.forEach(s => {
            stepsHTML += `<li>${s}</li>`;
        });
        document.getElementById('stepsOutput').innerHTML = stepsHTML;

        document.getElementById('resultContainer').classList.remove('hidden');
    }
</script>

</body>
</html>
