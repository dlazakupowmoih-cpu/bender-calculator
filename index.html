<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eto Bender Suka! — Conduit Bending Calculator</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --border: #334155;
            --error: #f43f5e;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.25rem;
            color: var(--accent);
        }

        .lang-switch {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .tab {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .tab.active {
            background: var(--accent);
            color: var(--bg-color);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        select, input {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-color);
            padding: 12px;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input:focus {
            border-color: var(--accent);
        }

        .row {
            display: flex;
            gap: 12px;
        }

        .row .form-group {
            flex: 1;
        }

        .calc-panel {
            display: none;
        }

        .calc-panel.active {
            display: block;
        }

        .results {
            background: rgba(56, 189, 248, 0.05);
            border: 1px dashed var(--accent);
            border-radius: 12px;
            padding: 16px;
            margin-top: 16px;
        }

        .results h3 {
            font-size: 0.95rem;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .result-item:last-child {
            margin-bottom: 0;
        }

        .result-val {
            font-weight: bold;
            color: var(--text-color);
        }

        .units-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        .unit-btn {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .unit-btn.active {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(56, 189, 248, 0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>⚡ Eto Bender Suka!</h1>
        <button class="lang-switch" id="langToggle">EN / RU</button>
    </header>

    <div class="units-toggle">
        <button class="unit-btn active" id="unitInches" onclick="setUnits('in')">Inches (дюймы)</button>
        <button class="unit-btn" id="unitMm" onclick="setUnits('mm')">MM (мм)</button>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('offset')" data-i18n="tab_offset">Offset</button>
        <button class="tab" onclick="switchTab('stub')" data-i18n="tab_stub">Stub-Up</button>
        <button class="tab" onclick="switchTab('threePoint')" data-i18n="tab_3pt">3-Pt Saddle</button>
        <button class="tab" onclick="switchTab('parallel')" data-i18n="tab_parallel">Parallel</button>
    </div>

    <!-- OFFSET PANEL -->
    <div id="panel-offset" class="calc-panel active">
        <div class="card">
            <div class="row">
                <div class="form-group">
                    <label data-i18n="conduit_type">Type</label>
                    <select id="offset-type" onchange="calculate()">
                        <option value="EMT">EMT</option>
                        <option value="IMC">IMC</option>
                        <option value="Rigid">Rigid</option>
                    </select>
                </div>
                <div class="form-group">
                    <label data-i18n="conduit_size">Size</label>
                    <select id="offset-size" onchange="calculate()">
                        <option value="1/2">1/2"</option>
                        <option value="3/4" selected>3/4"</option>
                        <option value="1">1"</option>
                        <option value="1-1/4">1-1/4"</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label data-i18n="bend_angle">Angle</label>
                <select id="offset-angle" onchange="calculate()">
                    <option value="10">10°</option>
                    <option value="22">22.5°</option>
                    <option value="30">30°</option>
                    <option value="45" selected>45°</option>
                    <option value="60">60°</option>
                </select>
            </div>

            <div class="form-group">
                <label id="offset-depth-label" data-i18n="offset_depth">Obstacle Depth</label>
                <input type="number" id="offset-depth" value="6" step="any" oninput="calculate()">
            </div>

            <div class="results">
                <h3 data-i18n="results">Results</h3>
                <div class="result-item">
                    <span data-i18n="res_distance">Distance between bends:</span>
                    <span class="result-val" id="res-offset-dist">0</span>
                </div>
                <div class="result-item">
                    <span data-i18n="res_shrink">Total Shrink:</span>
                    <span class="result-val" id="res-offset-shrink">0</span>
                </div>
            </div>
        </div>
    </div>

    <!-- STUB-UP PANEL -->
    <div id="panel-stub" class="calc-panel">
        <div class="card">
            <div class="row">
                <div class="form-group">
                    <label data-i18n="conduit_type">Type</label>
                    <select id="stub-type" onchange="calculate()">
                        <option value="EMT">EMT</option>
                        <option value="IMC">IMC</option>
                        <option value="Rigid">Rigid</option>
                    </select>
                </div>
                <div class="form-group">
                    <label data-i18n="conduit_size">Size</label>
                    <select id="stub-size" onchange="calculate()">
                        <option value="1/2">1/2"</option>
                        <option value="3/4" selected>3/4"</option>
                        <option value="1">1"</option>
                        <option value="1-1/4">1-1/4"</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label id="stub-height-label" data-i18n="stub_height">Desired Height (Stub-up)</label>
                <input type="number" id="stub-height" value="24" step="any" oninput="calculate()">
            </div>

            <div class="results">
                <h3 data-i18n="results">Results</h3>
                <div class="result-item">
                    <span data-i18n="res_mark">Mark from end (Pull back):</span>
                    <span class="result-val" id="res-stub-mark">0</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 3-POINT SADDLE PANEL -->
    <div id="panel-threePoint" class="calc-panel">
        <div class="card">
            <div class="row">
                <div class="form-group">
                    <label data-i18n="conduit_type">Type</label>
                    <select id="s3-type" onchange="calculate()">
                        <option value="EMT">EMT</option>
                        <option value="IMC">IMC</option>
                        <option value="Rigid">Rigid</option>
                    </select>
                </div>
                <div class="form-group">
                    <label data-i18n="conduit_size">Size</label>
                    <select id="s3-size" onchange="calculate()">
                        <option value="1/2">1/2"</option>
                        <option value="3/4" selected>3/4"</option>
                        <option value="1">1"</option>
                        <option value="1-1/4">1-1/4"</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label id="s3-depth-label" data-i18n="s3_depth">Obstacle Depth / Height</label>
                <input type="number" id="s3-depth" value="4" step="any" oninput="calculate()">
            </div>

            <div class="results">
                <h3 data-i18n="results">Results</h3>
                <div class="result-item">
                    <span data-i18n="res_center_mark">Center Mark:</span>
                    <span class="result-val" id="res-s3-center">Mark center to obstacle</span>
                </div>
                <div class="result-item">
                    <span data-i18n="res_side_marks">Side Marks spacing:</span>
                    <span class="result-val" id="res-s3-sides">0</span>
                </div>
                <div class="result-item">
                    <span data-i18n="res_shrink">Total Shrink:</span>
                    <span class="result-val" id="res-s3-shrink">0</span>
                </div>
            </div>
        </div>
    </div>

    <!-- PARALLEL BENDS PANEL -->
    <div id="panel-parallel" class="calc-panel">
        <div class="card">
            <div class="row">
                <div class="form-group">
                    <label data-i18n="conduit_size">Size</label>
                    <select id="par-size" onchange="calculate()">
                        <option value="1/2">1/2"</option>
                        <option value="3/4" selected>3/4"</option>
                        <option value="1">1"</option>
                    </select>
                </div>
                <div class="form-group">
                    <label data-i18n="par_count">Number of runs</label>
                    <input type="number" id="par-count" value="3" min="2" max="10" oninput="calculate()">
                </div>
            </div>

            <div class="form-group">
                <label id="par-spacing-label" data-i18n="par_spacing">Spacing between centers</label>
                <input type="number" id="par-spacing" value="3" step="any" oninput="calculate()">
            </div>

            <div class="results">
                <h3 data-i18n="results">Results</h3>
                <div class="result-item">
                    <span data-i18n="res_step">Step-up per pipe (Multiplier offset):</span>
                    <span class="result-val" id="res-par-step">0</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // --- СПРАВОЧНЫЕ КОНСТАНТЫ И ТАБЛИЦЫ ---
    const CONDUIT_SPECS = {
        EMT: {
            radius: { '1/2': 4.0, '3/4': 5.0, '1': 6.5, '1-1/4': 8.0 },
            stubTakeUp: { '1/2': 5.0, '3/4': 6.0, '1': 8.0, '1-1/4': 11.0 }
        },
        IMC: {
            radius: { '1/2': 4.125, '3/4': 5.25, '1': 6.75, '1-1/4': 8.25 },
            stubTakeUp: { '1/2': 5.0, '3/4': 6.0, '1': 8.0, '1-1/4': 11.0 }
        },
        Rigid: {
            radius: { '1/2': 4.25, '3/4': 5.5, '1': 7.0, '1-1/4': 8.5 },
            stubTakeUp: { '1/2': 5.0, '3/4': 6.0, '1': 8.0, '1-1/4': 11.0 }
        }
    };

    const MULTIPLIERS = {
        10: 5.76,
        22: 2.61,  // 22.5°
        30: 2.00,
        45: 1.414, // 45°
        60: 1.15
    };

    const SHRINK_FACTORS = {
        10: 0.088,
        22: 0.159, // 22.5°
        30: 0.268, // 30°
        45: 0.414, // 45°
        60: 0.577  // 60°
    };

    // --- ПЕРЕВОДЫ И СОСТОЯНИЕ ---
    let currentLang = 'ru';
    let currentUnit = 'in'; // 'in' или 'mm'

    const i18n = {
        en: {
            tab_offset: "Offset",
            tab_stub: "Stub-Up",
            tab_3pt: "3-Pt Saddle",
            tab_parallel: "Parallel",
            conduit_type: "Type",
            conduit_size: "Size",
            bend_angle: "Angle",
            offset_depth: "Obstacle Depth",
            stub_height: "Desired Height (Stub-up)",
            s3_depth: "Obstacle Depth / Height",
            par_count: "Number of runs",
            par_spacing: "Spacing between centers",
            results: "Results",
            res_distance: "Distance between bends:",
            res_shrink: "Total Shrink:",
            res_mark: "Mark from end (Pull back):",
            res_center_mark: "Center Mark:",
            res_side_marks: "Side Marks spacing:",
            res_step: "Extra advance per pipe:"
        },
        ru: {
            tab_offset: "Оффсет",
            tab_stub: "Штабик (Stub)",
            tab_3pt: "3-точечный Сед",
            tab_parallel: "Параллель",
            conduit_type: "Тип",
            conduit_size: "Размер",
            bend_angle: "Угол",
            offset_depth: "Глубина обхода (Offset)",
            stub_height: "Высота подъема (Stub-up)",
            s3_depth: "Высота препятствия",
            par_count: "Количество труб",
            par_spacing: "Расстояние между осями",
            results: "Результаты",
            res_distance: "Расстояние между гибами:",
            res_shrink: "Общий шринк (Shrink):",
            res_mark: "Метка от конца (Pull back):",
            res_center_mark: "Центральная метка:",
            res_side_marks: "Интервал боковых меток:",
            res_step: "Добавка на каждую трубу:"
        }
    };

    function setUnits(unit) {
        currentUnit = unit;
        document.getElementById('unitInches').classList.toggle('active', unit === 'in');
        document.getElementById('unitMm').classList.toggle('active', unit === 'mm');
        
        // Пересчет подписи единиц в полях
        const suffix = unit === 'mm' ? ' (мм)' : ' (дюймы)';
        document.getElementById('offset-depth-label').innerText = (currentLang === 'ru' ? i18n.ru.offset_depth : i18n.en.offset_depth) + suffix;
        document.getElementById('stub-height-label').innerText = (currentLang === 'ru' ? i18n.ru.stub_height : i18n.en.stub_height) + suffix;
        document.getElementById('s3-depth-label').innerText = (currentLang === 'ru' ? i18n.ru.s3_depth : i18n.en.s3_depth) + suffix;
        document.getElementById('par-spacing-label').innerText = (currentLang === 'ru' ? i18n.ru.par_spacing : i18n.en.par_spacing) + suffix;

        calculate();
    }

    function convertInput(val) {
        let num = parseFloat(val) || 0;
        return currentUnit === 'mm' ? num / 25.4 : num; // все расчеты внутри ведутся в дюймах
    }

    function formatOutput(valInches) {
        if (isNaN(valInches)) return "0";
        if (currentUnit === 'mm') {
            return (valInches * 25.4).toFixed(1) + " мм";
        } else {
            // Округляем до ближайших 1/16 или сотых
            return valInches.toFixed(2) + ' "';
        }
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.calc-panel').forEach(p => p.classList.remove('active'));
        
        event.currentTarget.classList.add('active');
        document.getElementById('panel-' + tabId).classList.add('active');
        calculate();
    }

    document.getElementById('langToggle').addEventListener('click', () => {
        currentLang = currentLang === 'ru' ? 'en' : 'ru';
        updateTexts();
    });

    function updateTexts() {
        const dict = i18n[currentLang];
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (dict[key]) el.innerText = dict[key];
        });
        setUnits(currentUnit);
    }

    // --- ОСНОВНАЯ ЛОГИКА РАСЧЕТОВ ---
    function calculate() {
        // 1. Offset Calculation
        const offType = document.getElementById('offset-type').value;
        const offSize = document.getElementById('offset-size').value;
        const offAngle = parseInt(document.getElementById('offset-angle').value);
        const offDepthRaw = document.getElementById('offset-depth').value;
        const depthInches = convertInput(offDepthRaw);

        const multiplier = MULTIPLIERS[offAngle] || 1.414;
        const shrinkFactor = SHRINK_FACTORS[offAngle] || 0.414;

        const distBetweenBends = depthInches * multiplier;
        const totalShrink = depthInches * shrinkFactor;

        document.getElementById('res-offset-dist').innerText = formatOutput(distBetweenBends);
        document.getElementById('res-offset-shrink').innerText = formatOutput(totalShrink);

        // 2. Stub-Up Calculation
        const stubType = document.getElementById('stub-type').value;
        const stubSize = document.getElementById('stub-size').value;
        const stubHeightRaw = document.getElementById('stub-height').value;
        const heightInches = convertInput(stubHeightRaw);

        const takeUp = CONDUIT_SPECS[stubType].stubTakeUp[stubSize] || 6.0;
        const pullBack = heightInches - takeUp;

        document.getElementById('res-stub-mark').innerText = formatOutput(pullBack);

        // 3. Three-Point Saddle Calculation
        const s3DepthRaw = document.getElementById('s3-depth').value;
        const s3DepthInches = convertInput(s3DepthRaw);
        const s3Angle = 45; // Стандарт для 3-point седла обычно 45° центр, 22.5° боковые
        
        // Для 45° центрального гиба сдвиг боковых меток зависит от угла и высоты
        const s3Shrink = s3DepthInches * 3/16; // эмпирический коэффициент усадки 3-point
        const sideSpacing = s3DepthInches * 1.414 * 2; // Базовый расчет интервала

        document.getElementById('res-s3-center').innerText = currentLang === 'ru' ? "Центр строго над препятствием" : "Center directly over obstacle";
        document.getElementById('res-s3-sides').innerText = formatOutput(s3DepthInches * 2.61); // коэффициент для 22.5 от центра
        document.getElementById('res-s3-shrink').innerText = formatOutput(s3DepthInches * 0.38);

        // 4. Parallel Bends Calculation
        const parSpacingRaw = document.getElementById('par-spacing').value;
        const parSpacingInches = convertInput(parSpacingRaw);
        const stepUp = parSpacingInches * multiplier;

        document.getElementById('res-par-step').innerText = formatOutput(stepUp);
    }

    // Инициализация при загрузке
    updateTexts();
</script>

</body>
</html>
