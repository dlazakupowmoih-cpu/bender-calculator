<div class="card">
    <div class="section-title">Введите размеры (Rise / Run / Width)</div>

    <div class="form-group">
        <label>Высота подъёма (Rise / Opposite)</label>
        <div class="inch-split">
            <input type="number" id="a-rise-whole" value="4" min="0" oninput="tab2.calculateAngle3D()" />
            <select id="a-rise-frac" class="frac-select" onchange="tab2.calculateAngle3D()"></select>
        </div>
    </div>

    <div class="form-group">
        <label>Горизонтальное расстояние (Run / Adjacent)</label>
        <div class="inch-split">
            <input type="number" id="a-run-whole" value="12" min="0" oninput="tab2.calculateAngle3D()" />
            <select id="a-run-frac" class="frac-select" onchange="tab2.calculateAngle3D()"></select>
        </div>
    </div>

    <div class="form-group">
        <label>Ширина (Width / Depth)</label>
        <div class="inch-split">
            <input type="number" id="a-width-whole" value="0" min="0" oninput="tab2.calculateAngle3D()" />
            <select id="a-width-frac" class="frac-select" onchange="tab2.calculateAngle3D()"></select>
        </div>
    </div>

    <button class="btn" onclick="tab2.calculateAngle3D()">Пересчитать угол</button>

    <div id="a-results-card" class="results" style="display:none; margin-top:12px;"></div>
</div>
